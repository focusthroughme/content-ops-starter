<title>Touchline Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: fixed navy touchline (sidebar) on the left, light working pitch on the right; sidebar folds into a top strip on phones. */
:root{
  --navy:#12264a; --navy-2:#1b3566; --navy-fg:#dbe4f5; --navy-mute:#93a5c7;
  --bg:#f3f5f9; --surface:#ffffff; --surface-2:#f8f9fc; --fg:#15213a; --mute:#5b6a83; --line:#dde3ec;
  --accent:#17865b; --accent-soft:#e2f4ec; --accent-fg:#ffffff;
  --blue:#2a5fc4; --blue-soft:#e6eefc; --warn:#a85f00; --warn-soft:#fdf0d8; --bad:#b8323c; --bad-soft:#fbe6e8;
  --violet:#6a4bb5; --violet-soft:#eee9fa;
  --shadow:0 1px 2px rgba(18,38,74,.06),0 4px 14px rgba(18,38,74,.06);
  --display:"Space Grotesk","Inter",system-ui,sans-serif; --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --gut:28px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --navy:#0a162d; --navy-2:#16284d; --navy-fg:#dbe4f5; --navy-mute:#8697b8;
  --bg:#0e1626; --surface:#162036; --surface-2:#1b2740; --fg:#e7ecf5; --mute:#9eabc2; --line:#2a3852;
  --accent:#3fcf97; --accent-soft:#143528; --accent-fg:#06281b;
  --blue:#7fa8f5; --blue-soft:#1a2c52; --warn:#f0b455; --warn-soft:#3a2c10; --bad:#f08a92; --bad-soft:#40181d;
  --violet:#b39df0; --violet-soft:#2a2248; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark } }
:root[data-theme="dark"]{
  --navy:#0a162d; --navy-2:#16284d; --navy-fg:#dbe4f5; --navy-mute:#8697b8;
  --bg:#0e1626; --surface:#162036; --surface-2:#1b2740; --fg:#e7ecf5; --mute:#9eabc2; --line:#2a3852;
  --accent:#3fcf97; --accent-soft:#143528; --accent-fg:#06281b;
  --blue:#7fa8f5; --blue-soft:#1a2c52; --warn:#f0b455; --warn-soft:#3a2c10; --bad:#f08a92; --bad-soft:#40181d;
  --violet:#b39df0; --violet-soft:#2a2248; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--body)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:24px;font-weight:700} h2{font-size:17px;font-weight:600} h3{font-size:14px;font-weight:600}
p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:228px minmax(0,1fr);min-height:100%}
.side{background:var(--navy);color:var(--navy-fg);position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;gap:18px;
  padding:22px 14px 18px max(14px,env(safe-area-inset-left,0px));overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand-mark{width:30px;height:30px;border-radius:8px;border:2px solid var(--accent);position:relative;flex:none}
.brand-mark::before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:2px solid var(--accent)}
.brand-mark::after{content:"";position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px;border:2px solid var(--accent);border-radius:50%;background:var(--navy)}
.brand b{font-family:var(--display);font-size:16px;font-weight:700;color:#fff;line-height:1.1;display:block}
.brand small{color:var(--navy-mute);font-size:11px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;color:var(--navy-fg);text-decoration:none;font-weight:500;white-space:nowrap}
.nav a:hover{background:var(--navy-2)}
.nav a[aria-current="page"]{background:var(--navy-2);color:#fff;box-shadow:inset 3px 0 0 var(--accent)}
.nav .cnt{font-size:11px;color:var(--navy-mute);font-variant-numeric:tabular-nums}
.side-foot{margin-top:auto;font-size:12px;color:var(--navy-mute);padding:0 8px;display:flex;flex-direction:column;gap:6px}
.sync{display:inline-flex;align-items:center;gap:6px;color:var(--navy-fg)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--navy-mute);flex:none}
.sync.ok i{background:#3fcf97} .sync.local i{background:#f0b455}

.main{min-width:0;padding-block:24px 48px;padding-left:max(var(--gut),env(safe-area-inset-left,0px));padding-right:max(var(--gut),env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.head p{color:var(--mute);max-width:70ch}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tools input[type=search],.tools select{height:36px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:0 10px;min-width:0}
.tools input[type=search]{flex:1 1 180px;max-width:280px}
.tools .sp{flex:1}
.btn{height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--mute)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.btn.danger{color:var(--bad)} .btn.danger[data-armed]{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{height:28px;padding:0 10px;font-size:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;height:34px;padding:0 12px;cursor:pointer;font-weight:500;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}

.note{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:8px;padding:10px 14px;color:var(--mute);max-width:100ch}
.note.warn{border-left-color:var(--warn)} .note b{color:var(--fg)}
.empty{border:1px dashed var(--line);border-radius:12px;padding:28px 20px;text-align:center;color:var(--mute);display:flex;flex-direction:column;gap:10px;align-items:center}

.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--mute);border:1px solid var(--line);white-space:nowrap}
.tag.prev{background:var(--blue-soft);color:var(--blue);border-color:transparent}
.tag.new{background:var(--violet-soft);color:var(--violet);border-color:transparent}
.tag.verify{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.tag.ok{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.tag.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tags .btn{white-space:normal;height:auto;min-height:28px;padding-block:4px;text-align:left}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none;background:var(--mute)}
.dot.high{background:var(--bad)} .dot.medium{background:var(--warn)} .dot.low{background:var(--line)}

/* Kanban */
.board-wrap{overflow-x:auto;padding-bottom:6px}
.board{display:grid;grid-template-columns:repeat(6,minmax(230px,1fr));gap:12px;min-width:0}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:160px}
.col.over{border-color:var(--accent);background:var(--accent-soft)}
.col-h{display:flex;justify-content:space-between;align-items:center;font-family:var(--display);font-weight:600;padding:2px 4px}
.col-h span{color:var(--mute);font-family:var(--body);font-size:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:7px;box-shadow:var(--shadow);cursor:grab}
.card.dragging{opacity:.4}
.card-t{font-weight:600;line-height:1.3;background:none;border:0;padding:0;text-align:left;cursor:pointer;overflow-wrap:anywhere}
.card-t:hover{color:var(--accent)}
.meta{font-size:12px;color:var(--mute);overflow-wrap:anywhere}
.card-f{display:flex;gap:6px;align-items:center;justify-content:space-between}
.card-f select{height:26px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-size:12px;padding:0 4px;max-width:60%}
.col-empty{font-size:12px;color:var(--mute);text-align:center;padding:14px 4px}

/* Tables */
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:720px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);text-align:left;font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.linkish{background:none;border:0;padding:0;font-weight:600;cursor:pointer;text-align:left}
.linkish:hover{color:var(--accent)}
.blank{color:var(--mute)}

/* Panels */
.grid{display:grid;gap:14px}
.grid.c2{grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr))}
.grid.c3{grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel h2 small{font:500 12px var(--body);color:var(--mute);margin-left:6px}
.panel ul,.panel ol{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.kind{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.kind.obs{color:var(--accent)} .kind.hyp{color:var(--violet)} .kind.exp{color:var(--blue)}
.bars{display:flex;flex-direction:column;gap:10px}
.bar-row{display:grid;grid-template-columns:92px minmax(0,1fr);gap:10px;align-items:center}
.bar-row .lbl{font-weight:600}
.bar-track{background:var(--surface-2);border-radius:4px;height:14px;overflow:hidden}
.bar-fill{background:var(--accent);height:100%;border-radius:4px;min-width:2px}
.bar-meta{grid-column:2;font-size:12px;color:var(--mute)}

/* Calendar */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;min-height:170px;min-width:0}
.day.today{border-color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.day-h{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--display);font-weight:600}
.day-h span{font:500 12px var(--body);color:var(--mute)}
.ev{border:0;text-align:left;border-radius:6px;padding:5px 7px;font-size:12px;font-weight:500;cursor:pointer;overflow-wrap:anywhere;line-height:1.3}
.ev.film{background:var(--blue-soft);color:var(--blue)} .ev.pub{background:var(--accent-soft);color:var(--accent)}
.ev b{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.06em}
.day-add{margin-top:auto;display:flex;gap:4px;flex-wrap:wrap}
.day-add button{border:1px dashed var(--line);background:none;border-radius:6px;font-size:11px;padding:3px 6px;cursor:pointer;color:var(--mute)}
.day-add button:hover{color:var(--fg);border-color:var(--mute)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mute);align-items:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}

/* Action cards */
.act{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.act .what{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--accent)}
.act ul{font-size:13px;color:var(--mute)}
.lane h2{display:flex;justify-content:space-between;align-items:baseline}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(10,20,40,.55);display:flex;align-items:flex-start;justify-content:center;z-index:50;
  padding:max(16px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));overflow:auto}
.modal{background:var(--surface);border-radius:14px;width:min(820px,100%);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3);margin:auto}
.modal-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.modal-b{padding:16px 18px;display:flex;flex-direction:column;gap:16px}
.modal-f{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;padding:14px 18px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface);border-radius:0 0 14px 14px}
.modal-f .sp{flex:1}
.x{border:0;background:none;font-size:22px;line-height:1;cursor:pointer;color:var(--mute);padding:4px 8px}
fieldset{border:0;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:12px;min-width:0}
legend{font-family:var(--display);font-weight:600;font-size:13px;padding:0 0 8px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld.wide{grid-column:1/-1}
.fld>span{font-size:12px;font-weight:600;color:var(--mute)}
.fld input[type=text],.fld input[type=date],.fld select,.fld textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
.fld textarea{resize:vertical;line-height:1.45}
.fld small{color:var(--mute);font-size:12px}
.chks{display:flex;flex-wrap:wrap;gap:6px}
.chk{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:4px 10px;cursor:pointer;font-size:13px}
.rows{display:flex;flex-direction:column;gap:6px}
.row{display:flex;gap:8px;align-items:center}
.row input[type=text]{flex:1}
.row input[type=checkbox]{width:18px;height:18px;flex:none;accent-color:var(--accent)}
.row .x{font-size:18px}
.plat{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.plat p{font-size:12px;color:var(--mute)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
textarea.code{font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;width:100%;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);padding:10px;min-height:120px}

@media (max-width:1020px){ .app{grid-template-columns:188px minmax(0,1fr)} :root{--gut:20px}
  .week{grid-template-columns:repeat(4,minmax(0,1fr))} }
@media (max-width:720px){
  :root{--gut:16px}
  .app{display:block}
  .side{position:static;height:auto;flex-direction:column;gap:10px;padding:12px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));overflow:visible}
  .brand{padding:0}
  .nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px;scrollbar-width:none}
  .nav a{padding:7px 12px} .nav a[aria-current="page"]{box-shadow:inset 0 -3px 0 var(--accent)}
  .side-foot{margin:0;padding:0;flex-direction:row;flex-wrap:wrap;gap:4px 14px}
  .week{grid-template-columns:minmax(0,1fr)} .day{min-height:0}
  h1{font-size:21px}
  .board{grid-template-columns:repeat(6,82vw)}
}
@media (prefers-reduced-motion:no-preference){ .btn,.nav a,.card{transition:background .12s,border-color .12s} }
</style>

<div class="app">
  <aside class="side">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span><div><b>Touchline Studio</b><small>Miguel Ebrahimi · Luxembourg</small></div></div>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
    <div class="side-foot">
      <span class="sync" id="sync"><i></i><span>Connecting…</span></span>
      <span id="clock"></span>
    </div>
  </aside>
  <main class="main">
    <div class="head"><div><h1 id="view-title"></h1><p id="view-sub"></p></div></div>
    <div class="tools" id="v-tools"></div>
    <div id="v-body"></div>
  </main>
</div>
<div id="modal-root"></div>
<div id="toast-root" aria-live="polite"></div>

<script>

const TZ='Europe/Luxembourg';

const TEMPLATES=[
 {id:'matchday',name:'Matchday Vlog',type:'Matchday vlog',aspect:'16:9',

 {id:'interview',name:'Player Interview',type:'Player interview',aspect:'16:9',

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const lines=s=>String(s||'').split('\n').map(x=>x.trim()).filter(Boolean);
const clone=o=>JSON.parse(JSON.stringify(o));
const label=(pairs,v)=>(pairs.find(p=>p[0]===v)||[,v||''])[1];
function todayLux(){return new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());}
const toD=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(Date.UTC(y,m-1,d));};
const ymd=d=>d.toISOString().slice(0,10);
const addDays=(s,n)=>{const d=toD(s);d.setUTCDate(d.getUTCDate()+n);return ymd(d);};
const mondayOf=s=>addDays(s,-((toD(s).getUTCDay()+6)%7));
const diffDays=(a,b)=>Math.round((toD(b)-toD(a))/864e5);
const fmt=(s,o)=>s?new Intl.DateTimeFormat('en-GB',{timeZone:'UTC',...o}).format(toD(s)):'';
const fmtShort=s=>fmt(s,{day:'numeric',month:'short'});
const fmtFull=s=>fmt(s,{day:'numeric',month:'short',year:'numeric'});
function isoWeek(s){const d=toD(s);d.setUTCDate(d.getUTCDate()+3-((d.getUTCDay()+6)%7));const w1=new Date(Date.UTC(d.getUTCFullYear(),0,4));return 1+Math.round(((d-w1)/864e5-3+((w1.getUTCDay()+6)%7))/7);}
function parseViews(t){ if(t==null) return null; const s=String(t).toLowerCase().trim(); if(!s) return null;
  const m=s.match(/([\d][\d.,\s]*)\s*(k|tsd|mio|mn|m)?/); if(!m) return null; const raw=m[1].trim(), suf=m[2];
  if(suf){const n=parseFloat(raw.replace(/\s/g,'').replace(',','.')); if(isNaN(n)) return null; return Math.round(n*(suf==='k'||suf==='tsd'?1e3:1e6));}
  const n=parseInt(raw.replace(/[.,\s]/g,''),10); return isNaN(n)?null:n; }
function parseAgeMonths(t){ const s=String(t||'').toLowerCase(); const m=s.match(/(\d+)/); if(!m) return null; const n=+m[1];
  if(/\b(years?|jahr\w*|ans?|années?)\b/.test(s)) return n*12;
  if(/\b(months?|monat\w*|mois)\b/.test(s)) return n;
  if(/\b(weeks?|woche\w*|semaines?)\b/.test(s)) return n/4.345;
  if(/\b(days?|tag\w*|jours?)\b/.test(s)) return n/30.4;
  if(/\b(hours?|stunde\w*|heures?)\b/.test(s)) return n/730;
  return null; }
const nf=n=>n==null?'':new Intl.NumberFormat('en-GB').format(Math.round(n));
const median=a=>{if(!a.length)return null;const s=[...a].sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2;};
function toast(msg){const r=$('#toast-root');r.innerHTML=`<div class="toast">${esc(msg)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>r.innerHTML='',3200);}

/* ---------- state + storage ---------- */
const S={mode:'loading',db:null,dl:null,slow:false,data:{projects:{},videos:{},clips:{},templates:{}},route:'pipeline',
  ui:{pview:'board',f:{q:'',type:'',topic:'',lang:'',platform:'',label:''},af:{q:'',topic:'',platform:''},cf:'',week:''}};
try{Object.assign(S.ui,JSON.parse(localStorage.getItem(LSUI)||'{}'));}catch(e){}
S.ui.week=''; // always open on the current week
const saveUI=()=>{try{localStorage.setItem(LSUI,JSON.stringify(S.ui));}catch(e){}};
const all=c=>Object.values(S.data[c]);
const persistLocal=()=>{try{localStorage.setItem(LS,JSON.stringify(S.data));}catch(e){toast('This browser blocked local storage. Export a backup to keep your changes.');}};
const queues=new Map();
function dbWrite(coll,id,fn){const k=coll+'/'+id;const p=(queues.get(k)||Promise.resolve()).then(fn).catch(e=>{toast('Could not save ('+((e&&e.code)||'error')+'). Your change may not be stored.');});queues.set(k,p);return p;}
function put(coll,obj,quiet){ obj.updatedAt=new Date().toISOString(); S.data[coll][obj.id]=obj;
  if(S.mode==='sync'){const body=clone(obj);dbWrite(coll,obj.id,()=>S.db.collection(coll).doc(obj.id).set(body));} else persistLocal();
  if(!quiet) renderData(); }
function del(coll,id,quiet){ delete S.data[coll][id];
  if(S.mode==='sync') dbWrite(coll,id,()=>S.db.collection(coll).doc(id).delete()); else persistLocal();
  if(!quiet) renderData(); }
async function initStore(){
  let db=null;
  try{ if(window.claude&&window.claude.use){ db=await window.claude.use('db'); S.dl=await window.claude.use('downloads'); } }catch(e){}
  if(db){ S.db=db; S.mode='sync'; let pending=COLLS.length; const seen={};
    const slow=setTimeout(()=>{S.slow=true;renderData();},10000);
    COLLS.forEach(c=>db.collection(c).onSnapshot(snap=>{
      const o={}; snap.docs.forEach(d=>{o[d.id]={...clone(d.data()),id:d.id};}); S.data[c]=o;
      if(!seen[c]&&!snap.metadata.fromCache){seen[c]=1; if(--pending===0){clearTimeout(slow);S.slow=false;S.ready=true;}}
      renderData();
    },err=>{clearTimeout(slow);S.ready=true;toast('Sync stopped ('+err.code+'). Reload the page to reconnect.');renderData();}));
  } else {
    S.mode='local'; S.ready=true;
    try{const d=JSON.parse(localStorage.getItem(LS)||'null'); if(d) COLLS.forEach(c=>S.data[c]=d[c]||{});}catch(e){}
  }
  renderData();
}
const isEmpty=()=>COLLS.every(c=>!all(c).length);

/* ---------- backup: export / import ---------- */
function exportObj(){return {app:'touchline-studio',version:1,exportedAt:new Date().toISOString(),projects:all('projects'),videos:all('videos'),clips:all('clips'),templates:all('templates')};}
const blankVal=v=>v==null||v===''||(Array.isArray(v)&&!v.length);
function mergeRecord(cur,inc){ // keeps anything the user edited; fills or updates the rest
  const out=clone(cur), locked=new Set(cur.userCreated?Object.keys(cur):(cur.edited||[])); let changed=0,kept=0;
  for(const k of Object.keys(inc)){ if(k==='id'||k==='edited'||k==='updatedAt'||k==='userCreated') continue;
    if(JSON.stringify(cur[k])===JSON.stringify(inc[k])) continue;
    if(locked.has(k)&&!blankVal(cur[k])){kept++;continue;}
    if(blankVal(inc[k])&&!blankVal(cur[k])) continue;
    out[k]=clone(inc[k]); changed++; }
  return {out,changed,kept}; }
function importData(obj,mode){
  if(!obj||obj.app!=='touchline-studio') throw new Error('This is not a Touchline Studio backup file.');
  let added=0,updated=0,kept=0;
  if(mode==='replace') COLLS.forEach(c=>all(c).forEach(r=>del(c,r.id,true)));
  COLLS.forEach(c=>(obj[c]||[]).forEach(r=>{ if(!r||!r.id||!/^[A-Za-z0-9_\-.~:@+]{1,200}$/.test(r.id)) return;
    const cur=S.data[c][r.id];
    if(!cur){put(c,clone(r),true);added++;}
    else{const m=mergeRecord(cur,r); kept+=m.kept; if(m.changed){put(c,m.out,true);updated++;}} }));
  renderData();
  return `Imported: ${added} added, ${updated} updated${kept?`, ${kept} of your edited fields kept as they were`:''}.`; }
async function loadStarter(){ try{const r=await fetch('seed.json'); if(!r.ok) throw 0; toast(importData(await r.json(),'merge'));}catch(e){toast('The starter plan could not be loaded here. Use Import on the Data & backup page.');} }

/* ---------- domain logic ---------- */
function filteredProjects(){ const f=S.ui.f,q=f.q.trim().toLowerCase();
  return all('projects').filter(p=>(!q||[p.title,p.people,p.location,p.hook,p.notes,p.type].join(' ').toLowerCase().includes(q))
    &&(!f.type||p.type===f.type)&&(!f.topic||p.topic===f.topic)&&(!f.lang||(p.languages||[]).includes(f.lang))&&(!f.platform||(p.platforms||[]).includes(f.platform))
    &&(!f.label||(f.label==='verify'?p.verify:p.origin===f.label)))
  .sort((a,b)=>({high:0,medium:1,low:2}[a.priority]-({high:0,medium:1,low:2})[b.priority])||(a.publishDate||'9').localeCompare(b.publishDate||'9')||a.title.localeCompare(b.title)); }
function originTag(p){return p.origin==='new'?'<span class="tag new">New suggestion</span>':p.origin==='previous'?'<span class="tag prev">Previous idea</span>':'<span class="tag">Added by you</span>';}
function collabTag(p){return p.collab==='confirmed'?'<span class="tag ok">Collab confirmed</span>':p.collab==='asked'?'<span class="tag">Asked, not confirmed</span>':p.collab==='idea'?'<span class="tag">Idea, nobody asked</span>':'';}
function projectTags(p){return `<div class="tags">${originTag(p)}${p.verify?'<span class="tag verify">Status to verify</span>':''}${collabTag(p)}</div>`;}
function shotProgress(p){const n=(p.shotlist||[]).length;return n?`${p.shotlist.filter(s=>s.done).length}/${n} shots`:'';}
function sourceName(c){const r=c.sourceKind==='project'?S.data.projects[c.sourceId]:S.data.videos[c.sourceId];return r?(r.title||r.label):'(original removed)';}

function urgency(d){return d==null?0:d<0?40:d<=2?30:d<=7?20:d<=14?10:0;}
function when(d,verb){return d==null?'':d<0?`${verb} date passed ${-d} day${d===-1?'':'s'} ago`:d===0?`${verb} date is today`:`${verb} date in ${d} day${d===1?'':'s'}`;}
function buildActions(){ const t=todayLux(), out=[];
  all('projects').forEach(p=>{ const pr={high:30,medium:15,low:5}[p.priority]??15, dF=p.filmDate?diffDays(t,p.filmDate):null, dP=p.publishDate?diffDays(t,p.publishDate):null;
    const R=[`${label(PRIOS,p.priority)} priority`]; const needsCollab=p.collab==='idea'||p.collab==='asked';
    const collabLine=p.collab==='confirmed'?'Collaboration is confirmed':p.collab==='asked'?'Asked, but the collaboration is not confirmed':p.collab==='idea'?'Still an idea: nobody has been asked':'';
    if(p.verify) out.push({lane:'check',p,score:55,what:'Verify status',reasons:[p.verifyNote||'Publication is not confirmed.']});
    let a=null;
    if(p.status==='Idea'&&!p.verify){ a={lane:needsCollab?'check':'film',score:pr,what:needsCollab?'Ask and confirm':'Set a filming date',reasons:[...R,'Status: Idea, nothing filmed']};
      if(collabLine)a.reasons.push(collabLine); if(p.material)a.reasons.push('Available material: '+p.material); if(dF!=null){a.reasons.push(when(dF,'Filming'));a.score+=urgency(dF);} }
    else if(p.status==='Planned'){ a={lane:'film',score:pr+20+urgency(dF),what:'Film',reasons:[...R,'Status: Planned',dF==null?'No filming date set yet':when(dF,'Filming')]};
      a.reasons.push((p.shotlist||[]).length?`Shotlist has ${p.shotlist.length} shots`:'Shotlist is empty'); if(collabLine)a.reasons.push(collabLine); if(needsCollab){a.what='Confirm before filming';} }
    else if(p.status==='Filmed'){ a={lane:'edit',score:pr+40+urgency(dP),what:'Start the edit',reasons:[...R,'Footage is filmed and waiting',dP==null?'No publishing date set yet':when(dP,'Publishing')]}; }
    else if(p.status==='Editing'){ a={lane:'edit',score:pr+50+urgency(dP),what:'Finish the edit',reasons:[...R,'Edit already in progress',dP==null?'No publishing date set yet':when(dP,'Publishing')]}; }
    else if(p.status==='Ready'){ a={lane:'post',score:pr+60+urgency(dP),what:'Publish',reasons:[...R,'Edit is finished',dP==null?'No publishing date set yet':when(dP,'Publishing')]};
      const miss=[!p.caption&&'caption',!p.thumbnail&&'thumbnail concept',!(p.titleIdeas||[]).length&&'title'].filter(Boolean); if(miss.length)a.reasons.push('Still missing: '+miss.join(', ')); }
    else if(p.status==='Published'){ a={lane:'post',score:12,what:'Move to archive, plan Shorts',reasons:['Marked as published','Record views from a screenshot once it has run for a while']}; }
    if(a){a.p=p;out.push(a);} });
  return out.sort((a,b)=>b.score-a.score||a.p.title.localeCompare(b.p.title)); }

V.analysis={title:'Channel analysis',sub:'Built only from the view counts in your archive. Observations are what the numbers show; hypotheses are untested ideas.',
 tools(){return '';},
 body(){ const vs=all('videos'), wv=vs.filter(v=>v.views!=null).sort((a,b)=>b.views-a.views);
  const rate=v=>{const m=parseAgeMonths(v.ageText);return m==null?null:v.views/Math.max(m,1);};
  const cats=[...TOPICS,''].map(t=>{const rec=vs.filter(v=>(v.topic||'')===t), w=rec.filter(v=>v.views!=null), rates=w.map(rate).filter(x=>x!=null);
    return {t:t||'Unsorted',n:rec.length,nv:w.length,med:median(w.map(v=>v.views)),rmed:median(rates),nr:rates.length};}).filter(c=>c.n);
  const useRate=cats.some(c=>c.rmed!=null), val=c=>useRate?c.rmed:c.med, max=Math.max(1,...cats.map(c=>val(c)||0));
  const obs=[`${wv.length} of ${vs.length} archive records have a view count recorded.`];
  if(wv.length){const top=wv[0];obs.push(`Most viewed: “${top.label||top.title}” with ${nf(top.views)} views${top.ageText?` (shown as ${top.ageText})`:''}.`);}
  const rk=cats.filter(c=>val(c)!=null).sort((a,b)=>val(b)-val(a));
  if(rk.length>=2) obs.push(`By median ${useRate?'views per month of age':'views'}: ${rk.map(c=>`${c.t} ${nf(val(c))} (${useRate?c.nr:c.nv} video${(useRate?c.nr:c.nv)===1?'':'s'})`).join(', ')}.${rk.some(c=>(useRate?c.nr:c.nv)<3)?' Groups with fewer than three videos are too small to trust.':''}`);
  const young=wv.filter(v=>{const m=parseAgeMonths(v.ageText);return m!=null&&m<1;}); if(young.length) obs.push(`${young.length} video${young.length===1?' is':'s are'} under a month old and still collecting views, so ${young.length===1?'it ranks':'they rank'} lower than ${young.length===1?'it':'they'} may end up.`);
  const noAge=wv.filter(v=>parseAgeMonths(v.ageText)==null).length; if(noAge) obs.push(`${noAge} video${noAge===1?' has':'s have'} views but no readable upload age, so no per-month figure.`);
  if(wv.length<3) obs.push('There is not enough data yet to compare formats. Add views, duration and upload age from your channel screenshots in the archive.');
  return `<div class="grid">
  <div class="note"><b>What this page cannot see.</b> Click-through rate, retention, exact upload dates and the footage itself are not available here. For those, open YouTube Studio or the TikTok and Instagram insights. Upload ages are the rounded text from your screenshots (“3 months ago”), so per-month figures are approximate.</div>
  <div class="grid c2">
   <section class="panel"><h2>Ranking by visible views <small>${wv.length} with data</small></h2>
    ${wv.length?`<div class="tbl-wrap" style="border:0"><table style="min-width:520px"><thead><tr><th>#</th><th>Video</th><th>Topic</th><th class="r">Views</th><th>Age shown</th><th class="r">≈ per month</th></tr></thead><tbody>${wv.map((v,i)=>{const r=rate(v);return `<tr><td class="num">${i+1}</td><td><button class="linkish" data-a="edit-video" data-id="${esc(v.id)}">${esc(v.label||v.title)}</button><div class="meta">${esc(v.source||'')}${v.capturedAt?' · captured '+fmtFull(v.capturedAt):''}</div></td><td>${esc(v.topic)||'<span class="blank">unsorted</span>'}</td><td class="r num">${nf(v.views)}</td><td>${esc(v.ageText)||'<span class="blank">blank</span>'}</td><td class="r num">${r==null?'<span class="blank">n/a</span>':nf(r)}</td></tr>`;}).join('')}</tbody></table></div>`
    :`<div class="empty">No view counts recorded yet, so there is nothing to rank.<button class="btn" data-a="go" data-r="archive">Open the archive</button></div>`}</section>
   <section class="panel"><h2>By content area <small>${useRate?'median views per month of age':'median views'}</small></h2>
    <div class="bars">${cats.map(c=>`<div class="bar-row"><span class="lbl">${esc(c.t)}</span><div class="bar-track">${val(c)!=null?`<div class="bar-fill" style="width:${(val(c)/max*100).toFixed(1)}%"></div>`:''}</div>
     <div class="bar-meta num">${c.n} record${c.n===1?'':'s'} · ${c.nv?`${c.nv} with views · median ${nf(c.med)} views${c.rmed!=null?` · ≈ ${nf(c.rmed)} per month`:''}`:'no views recorded'}</div></div>`).join('')||'<div class="blank">No archive records.</div>'}</div>
    <p class="meta">Older videos have had more time to collect views. Where an upload age is recorded, areas are compared on views per month of age; compare videos of similar age before drawing conclusions.</p></section>
  </div>
  <div class="grid c3">
   <section class="panel"><span class="kind obs">Observations · from your recorded numbers</span><ul>${obs.map(o=>`<li>${esc(o)}</li>`).join('')}</ul></section>
   <section class="panel"><span class="kind hyp">Hypotheses · untested, to check against your data</span><ul>
    <li>Videos built around one named player may spread through that player’s own circle (team-mates, club, family).</li>
    <li>Youth national-team games may be searched for around the match date, which would reward publishing quickly.</li>
    <li>A numbered series such as Trade-Up may bring viewers back for the next episode.</li>
    <li>The title language (German, Luxembourgish, French, English) may change who clicks in a multilingual audience.</li>
    <li>Shorts cut from a long video may send some viewers to the original.</li></ul></section>
   <section class="panel"><span class="kind exp">Practical experiments</span><ul>
    <li>Screenshot each new video’s view count at 7 and 30 days and record both, so videos are compared at the same age.</li>
    <li>For the next two player videos, ask one player to share it within 24 hours and not the other; compare at 30 days.</li>
    <li>Publish the next national-team video within 48 hours with opponent and age group in the title; compare with the earlier ones at the same age.</li>
    <li>Keep the format fixed and change only the title language on two similar videos.</li>
    <li>Cut three Shorts from one long video; note the long video’s views before the first Short and 14 days after.</li>
    <li>Change one thing per experiment and write the result in the video’s notes.</li></ul></section>
  </div></div>`; }};

V.calendar={title:'Weekly calendar',sub:'Filming and publishing dates, Monday to Sunday, in Europe/Luxembourg time.',
 tools(){return `<button class="btn" data-a="week" data-d="-1" aria-label="Previous week">← Previous</button><button class="btn" data-a="week" data-d="0">Today</button><button class="btn" data-a="week" data-d="1" aria-label="Next week">Next →</button>
  <strong id="week-label" class="num" style="margin-left:6px"></strong><span class="sp"></span>
  <span class="legend"><span><i style="background:var(--blue)"></i>Filming</span><span><i style="background:var(--accent)"></i>Publishing</span></span>`;},
 body(){ const t=todayLux(), mon=S.ui.week||mondayOf(t), days=[...Array(7)].map((_,i)=>addDays(mon,i)), ps=all('projects');
  const wl=$('#week-label'); if(wl) wl.textContent=`Week ${isoWeek(mon)} · ${fmtShort(mon)} – ${fmtFull(days[6])}`;
  const un=ps.filter(p=>p.status!=='Published'&&!p.filmDate&&!p.publishDate);
  return `<div class="grid"><div class="week">${days.map(d=>{const film=ps.filter(p=>p.filmDate===d), pub=ps.filter(p=>p.publishDate===d);
   return `<section class="day${d===t?' today':''}" data-date="${d}"><div class="day-h">${fmt(d,{weekday:'short'})} ${fmt(d,{day:'numeric'})}<span>${d===t?'Today':fmt(d,{month:'short'})}</span></div>
    ${film.map(p=>`<button class="ev film" data-a="edit-project" data-id="${esc(p.id)}"><b>Film</b>${esc(p.title)}</button>`).join('')}
    ${pub.map(p=>`<button class="ev pub" data-a="edit-project" data-id="${esc(p.id)}"><b>Publish</b>${esc(p.title)}</button>`).join('')}
    <div class="day-add"><button data-a="new-project" data-film="${d}">+ Filming</button><button data-a="new-project" data-pub="${d}">+ Publishing</button></div></section>`;}).join('')}</div>
   <section class="panel"><h2>Not scheduled yet <small>${un.length}</small></h2>${un.length?`<p class="meta">Open a project to give it a filming or publishing date.</p><div class="tags">${un.map(p=>`<button class="btn sm" data-a="edit-project" data-id="${esc(p.id)}">${esc(p.title)}</button>`).join('')}</div>`:'<p class="meta">Every active project has at least one date.</p>'}</section></div>`; }};

V.actions={title:'Priorities and next actions',sub:'What to film, edit or post next, ranked from each project’s status, deadlines, priority and available material.',
 tools(){return '';},
 body(){ const acts=buildActions(); if(!acts.length) return isEmpty()?starter():`<div class="empty">No active projects to rank.</div>`;
  const card=a=>`<div class="act"><span class="what">${esc(a.what)}</span><button class="linkish" data-a="edit-project" data-id="${esc(a.p.id)}">${esc(a.p.title)}</button>${projectTags(a.p)}<ul>${a.reasons.filter(Boolean).map(r=>`<li>${esc(r)}</li>`).join('')}</ul></div>`;
  const lane=(k,h,emp)=>{const l=acts.filter(a=>a.lane===k);return `<section class="panel lane"><h2>${h}<small>${l.length}</small></h2>${l.map(card).join('')||`<p class="meta">${emp}</p>`}</section>`;};
  const doable=acts.filter(a=>a.lane!=='check').slice(0,3);
  return `<div class="grid"><div class="note"><b>How this is ranked.</b> Projects closer to publishing come first (Ready, then Editing, Filmed, Planned, Idea), because finished material is worth more than a new shoot. Dates within 14 days and overdue dates push a project up, and so does a higher priority. A project marked “Idea, nobody asked” is a suggestion, not an agreed collaboration, and goes to “Confirm and verify” until you change its collaboration status.</div>
   ${doable.length?`<section class="panel"><h2>Do next</h2><div class="grid c3">${doable.map(card).join('')}</div></section>`:''}
   <div class="grid c2">${lane('film','Film next','Nothing is planned or ready to schedule. Confirm an idea first.')}${lane('edit','Edit next','No footage is waiting. Projects appear here once their status is Filmed or Editing.')}${lane('post','Post next','Nothing is ready to publish.')}${lane('check','Confirm and verify','Nothing is waiting on a confirmation.')}</div></div>`; }};

const tplOf=id=>{const d=TEMPLATES.find(t=>t.id===id);return {...d,...(S.data.templates[id]||{}),id};};
V.templates={title:'Reusable templates',sub:'Starting points for your five formats. Edit a template once, then create projects from it. Templates are written in English; write each language version yourself.',
 tools(){return '';},
 body(){return `<div class="grid c2">${TEMPLATES.map(d=>{const t=tplOf(d.id), custom=!!S.data.templates[d.id];return `<section class="panel"><h2>${esc(t.name)}${custom?'<small>edited by you</small>':''}</h2><p class="meta">${esc(t.blurb)}</p>
   <div><h3>Hook</h3><p>${esc(t.hook)}</p></div>
   <div><h3>Shotlist</h3><ol>${t.shotlist.map(s=>`<li>${esc(s)}</li>`).join('')}</ol></div>
   ${t.questions.length?`<div><h3>Questions</h3><ul>${t.questions.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></div>`:''}
   <div><h3>Title ideas</h3><ul>${t.titleIdeas.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></div>
   <div><h3>Canva thumbnail concept</h3><p>${esc(t.thumbnail)}</p></div>
   <div><h3>Caption</h3><p>${esc(t.caption)}</p></div><div><h3>Call to action</h3><p>${esc(t.cta)}</p></div>
   <div class="tools" style="margin-top:auto"><button class="btn pri" data-a="use-template" data-id="${d.id}">Create project</button><button class="btn" data-a="edit-template" data-id="${d.id}">Edit template</button>${custom?`<button class="btn danger" data-a="reset-template" data-id="${d.id}">Reset</button>`:''}</div></section>`;}).join('')}</div>`; }};

V.repurpose={title:'Shorts & Reels from longform',sub:'Vertical clips linked to the video they come from. A clip marked “to look for” is a suggestion, not a moment confirmed in your footage.',
 tools(){const src=[...new Set(all('clips').map(c=>c.sourceKind+':'+c.sourceId))].map(k=>{const[kind,id]=k.split(':');return [k,sourceName({sourceKind:kind,sourceId:id})];});
  return `<select id="cf-src" data-cf aria-label="Original video">${opt(src,S.ui.cf,'All original videos')}</select><span class="sp"></span><button class="btn pri" data-a="new-clip">New clip</button>`;},
 body(){ const cs=all('clips').filter(c=>!S.ui.cf||c.sourceKind+':'+c.sourceId===S.ui.cf); if(!all('clips').length) return isEmpty()?starter():`<div class="empty">No clips yet. Create one and link it to its original video.<button class="btn pri" data-a="new-clip">New clip</button></div>`;
  const groups={}; cs.forEach(c=>{(groups[c.sourceKind+':'+c.sourceId]=groups[c.sourceKind+':'+c.sourceId]||[]).push(c);});
  return `<div class="grid">${Object.entries(groups).map(([k,list])=>{const[kind,id]=k.split(':');return `<section class="panel"><h2>${esc(sourceName(list[0]))}<small>${kind==='video'?'published video':'pipeline project'} · ${list.length} clip${list.length===1?'':'s'}</small></h2>
   <div class="grid c3">${list.map(c=>{const done=(c.subs||[]).filter(s=>s.done).length;return `<div class="act"><div class="tags"><span class="tag ${c.status==='suggested'?'verify':c.status==='published'?'ok':''}">${esc(label(CLIP_STATUS,c.status))}</span><span class="tag">9:16</span></div>
     <button class="linkish" data-a="edit-clip" data-id="${esc(c.id)}">${esc(c.title)}</button>
     <div class="meta num">Source timecode: ${c.tcIn||c.tcOut?esc(c.tcIn||'?')+' – '+esc(c.tcOut||'?'):'not set'}</div>
     <div class="meta">${esc(c.angle)}</div>${c.hook?`<div><b>Hook:</b> ${esc(c.hook)}</div>`:''}
     <div class="meta num">Subtitle checklist ${done}/${(c.subs||[]).length}</div></div>`;}).join('')}</div>
   <div><button class="btn sm" data-a="new-clip" data-kind="${kind}" data-id="${esc(id)}">Add clip from this video</button></div></section>`;}).join('')||`<div class="empty">No clip for this original.</div>`}</div>`; }};

V.backup={title:'Data & backup',sub:'Where your data lives, how to back it up, and what this app does not do.',
 tools(){return '';},
 body(){ const n=`${all('projects').length} projects, ${all('videos').length} archive records, ${all('clips').length} clips, ${all('templates').length} edited templates`;
  return `<div class="grid c2">
   <section class="panel"><h2>Storage</h2>${S.mode==='sync'?`<p><span class="tag ok">Synchronized</span></p><p>Your data is saved in this page’s own database on Claude, tied to your account. Open this page on your desktop, iPad or phone while signed in and you see the same data; changes appear on other open devices within moments. It is not stored in your browser, so clearing browser data does not remove it. The page is private unless you share it; people you give contributor access could edit the same data.</p>`
    :S.mode==='local'?`<p><span class="tag verify">This browser only</span></p><p>The synchronized store is not available in this view, so data is saved in this browser’s local storage on this device. It does not appear on your other devices and is lost if you clear site data. Export a backup regularly.</p>`:`<p>Connecting…</p>`}
    <p class="meta">Currently stored: ${n}. Filters and the board/list choice are remembered per browser.</p></section>
   <section class="panel"><h2>What this app does not do</h2><ul><li>No live YouTube, TikTok or Instagram analytics. Views, durations and upload ages are typed in from screenshots and labelled with source and capture date.</li><li>No publishing or scheduling to any platform. Dates here are your plan.</li><li>No automatic translation. German, Luxembourgish, French and English are tags; you write each version.</li><li>No connection to CapCut or Canva. Shotlists, subtitle checklists and thumbnail concepts are notes for your own editing.</li></ul></section>
   <section class="panel"><h2>Export backup</h2><p class="meta">One JSON file with every project, archive record, clip and edited template.</p>
    <div class="tools">${S.dl?'<button class="btn pri" data-a="export-file">Save backup file</button>':''}<button class="btn${S.dl?'':' pri'}" data-a="export-copy">Copy backup JSON</button><button class="btn" data-a="export-show">Show JSON</button></div>
    <textarea class="code" id="export-box" readonly hidden aria-label="Backup JSON"></textarea></section>
   <section class="panel"><h2>Import backup</h2><p class="meta"><b>Merge</b> adds new records and updates existing ones, but never overwrites a field you edited yourself. <b>Replace</b> deletes everything first.</p>
    <label class="fld"><span>Choose a backup file</span><input type="file" id="import-file" accept=".json,application/json"></label>
    <label class="fld"><span>or paste backup JSON</span><textarea class="code" id="import-box" placeholder='{"app":"touchline-studio", …}'></textarea></label>
    <div class="tools"><button class="btn pri" data-a="import" data-mode="merge">Merge into my data</button><button class="btn danger" data-a="import" data-mode="replace">Replace everything</button>${isEmpty()?'<button class="btn" data-a="starter">Load starter plan</button>':''}</div></section>
  </div>`; }};

/* ---------- rendering ---------- */
function renderNav(){ $('#nav').innerHTML=NAV.map(([r,l,c])=>`<a href="#${r}"${S.route===r?' aria-current="page"':''}>${l}${c?`<span class="cnt">${c()}</span>`:''}</a>`).join('');
  const s=$('#sync'); s.className='sync '+(S.mode==='sync'?'ok':S.mode==='local'?'local':''); s.lastElementChild.textContent=S.mode==='sync'?'Synced to your Claude account':S.mode==='local'?'Stored in this browser only':'Connecting…';
  $('#clock').textContent=fmt(todayLux(),{weekday:'short',day:'numeric',month:'short',year:'numeric'})+' · Luxembourg'; }
function renderBody(){ const v=V[S.route]; $('#v-body').innerHTML=!S.ready?loading():v.body(); }
function renderData(){ renderNav(); renderBody(); if(S.route==='repurpose') $('#v-tools').innerHTML=V.repurpose.tools(); }
function renderRoute(){ const h=location.hash.slice(1); S.route=V[h]?h:'pipeline'; const v=V[S.route];
  $('#view-title').textContent=v.title; $('#view-sub').textContent=v.sub; const t=v.tools(); $('#v-tools').innerHTML=t; $('#v-tools').hidden=!t; renderNav(); renderBody(); }

/* ---------- modal + forms ---------- */
const fld=(l,inner,cls='')=>`<label class="fld ${cls}"><span>${l}</span>${inner}</label>`;
const inp=(id,v,type='text',ph='')=>`<input id="${id}" type="${type}" value="${esc(v)}" placeholder="${esc(ph)}">`;
const sel=(id,v,opts,any)=>`<select id="${id}">${any!=null?`<option value="">${any}</option>`:''}${opts.map(o=>{const[val,lab]=Array.isArray(o)?o:[o,o];return `<option value="${esc(val)}"${val===v?' selected':''}>${esc(lab)}</option>`;}).join('')}</select>`;
const ta=(id,v,rows=3,ph='')=>`<textarea id="${id}" rows="${rows}" placeholder="${esc(ph)}">${esc(v)}</textarea>`;
const chks=(name,vals,opts)=>`<div class="chks">${opts.map(o=>`<label class="chk"><input type="checkbox" name="${name}" value="${o}"${(vals||[]).includes(o)?' checked':''}>${o}</label>`).join('')}</div>`;
const rowHtml=(s,withCheck)=>`<div class="row">${withCheck?`<input type="checkbox"${s.done?' checked':''} aria-label="Done">`:''}<input type="text" value="${esc(s.t)}" aria-label="Item"><button type="button" class="x" data-a="row-del" aria-label="Remove">×</button></div>`;
const rowsEd=(id,items,withCheck,add)=>`<div class="rows" id="${id}" data-check="${withCheck?1:''}">${items.map(s=>rowHtml(s,withCheck)).join('')}</div><div><button type="button" class="btn sm" data-a="row-add" data-t="${id}">${add}</button></div>`;
const readRows=id=>$$('#'+id+' .row').map(r=>({t:$('input[type=text]',r).value.trim(),done:!!($('input[type=checkbox]',r)||{}).checked})).filter(s=>s.t);
const val=id=>$('#'+id).value.trim(); const picked=name=>$$(`input[name=${name}]:checked`).map(i=>i.value);
let modalCtx=null;
function openModal(title,body,foot,ctx){ modalCtx=ctx||null; $('#modal-root').innerHTML=`<div class="overlay" data-a="overlay"><form class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}" novalidate><div class="modal-h"><h2>${esc(title)}</h2><button type="button" class="x" data-a="close" aria-label="Close">×</button></div><div class="modal-b">${body}</div><div class="modal-f">${foot}</div></form></div>`;
  const f=$('#modal-root input[type=text]'); if(f&&!ctx?.noFocus) f.focus(); }
function closeModal(){ $('#modal-root').innerHTML=''; modalCtx=null; }
const P_FIELDS=['title','origin','verify','verifyNote','status','type','topic','people','location','filmDate','publishDate','priority','languages','platforms','aspect','collab','material','hook','shotlist','questions','titleIdeas','thumbnail','caption','cta','notes'];
function trackEdits(prev,next,fields){ if(!prev) {next.userCreated=true;return;} if(prev.userCreated){next.userCreated=true;return;}
  const e=new Set(prev.edited||[]); fields.forEach(k=>{if(JSON.stringify(prev[k]??null)!==JSON.stringify(next[k]??null)) e.add(k);}); next.edited=[...e]; }

function projectModal(p,isNew){
  const body=`${p.verify?`<div class="note warn"><b>Status to verify.</b> ${esc(p.verifyNote)}</div>`:''}
  <fieldset><legend>Basics</legend>${fld('Title',inp('p-title',p.title),'wide')}
   ${fld('Status',sel('p-status',p.status,STATUSES))}${fld('Priority',sel('p-priority',p.priority,PRIOS))}
   ${fld('Content type',sel('p-type',p.type,TYPES,'Not set'))}${fld('Topic',sel('p-topic',p.topic,TOPICS,'Not set'))}
   ${fld('Players / teams',inp('p-people',p.people))}${fld('Location',inp('p-location',p.location))}
   ${fld('Filming date',inp('p-filmDate',p.filmDate,'date'))}${fld('Publishing date',inp('p-publishDate',p.publishDate,'date'))}
   ${fld('Aspect ratio',sel('p-aspect',p.aspect,ASPECTS))}${fld('Collaboration',sel('p-collab',p.collab,COLLAB))}
   ${fld('Label',sel('p-origin',p.origin,ORIGINS))}
   <div class="fld"><span>Verification</span><label class="chk" style="border-radius:8px;padding:8px 10px"><input type="checkbox" id="p-verify"${p.verify?' checked':''}>Status to verify</label></div>
   <div class="fld wide"><span>Languages</span>${chks('p-lang',p.languages,LANGS)}</div><div class="fld wide"><span>Platforms</span>${chks('p-plat',p.platforms,PLATFORMS)}</div>
   ${fld('What needs verifying',inp('p-verifyNote',p.verifyNote),'wide')}
   ${fld('Available material',inp('p-material',p.material,'text','Footage, photos or earlier videos you already have'),'wide')}</fieldset>
  <fieldset><legend>Story</legend>${fld('Hook',ta('p-hook',p.hook,2),'wide')}
   <div class="fld wide"><span>Shotlist</span>${rowsEd('p-shots',p.shotlist||[],true,'Add shot')}</div>
   ${fld('Interview questions <small>one per line</small>',ta('p-questions',(p.questions||[]).join('\n'),4),'wide')}</fieldset>
  <fieldset><legend>Packaging</legend>${fld('Title ideas <small>one per line</small>',ta('p-titleIdeas',(p.titleIdeas||[]).join('\n'),3),'wide')}
   ${fld('Thumbnail concept (Canva)',ta('p-thumbnail',p.thumbnail,2),'wide')}${fld('Caption',ta('p-caption',p.caption,3),'wide')}
   ${fld('Call to action',inp('p-cta',p.cta),'wide')}${fld('Notes',ta('p-notes',p.notes,3),'wide')}</fieldset>`;
  const foot=`${isNew?'':`<button type="button" class="btn danger" data-a="del" data-c="projects" data-id="${esc(p.id)}">Delete</button><button type="button" class="btn" data-a="new-clip" data-kind="project" data-id="${esc(p.id)}">New clip from this</button>`}<span class="sp"></span><button type="button" class="btn" data-a="close">Cancel</button><button type="submit" class="btn pri">${isNew?'Create project':'Save changes'}</button>`;
  openModal(isNew?'New project':'Edit project',body,foot,{kind:'project',rec:p,isNew}); }
function blankProject(o){return {id:uid('p'),origin:'own',verify:false,verifyNote:'',status:'Idea',type:'',topic:'Football',people:'',location:'',filmDate:'',publishDate:'',priority:'medium',languages:[],platforms:['YouTube'],aspect:'16:9',collab:'none',material:'',hook:'',shotlist:[],questions:[],titleIdeas:[],thumbnail:'',caption:'',cta:'',notes:'',edited:[],...o};}
function saveProject(){ const {rec,isNew}=modalCtx; const title=val('p-title'); if(!title){toast('Give the project a title.');$('#p-title').focus();return;}
  const n={...clone(rec),title,status:val('p-status'),priority:val('p-priority'),type:val('p-type'),topic:val('p-topic'),people:val('p-people'),location:val('p-location'),filmDate:val('p-filmDate'),publishDate:val('p-publishDate'),aspect:val('p-aspect'),collab:val('p-collab'),origin:val('p-origin'),verify:$('#p-verify').checked,verifyNote:val('p-verifyNote'),languages:picked('p-lang'),platforms:picked('p-plat'),material:val('p-material'),hook:val('p-hook'),shotlist:readRows('p-shots'),questions:lines(val('p-questions')),titleIdeas:lines(val('p-titleIdeas')),thumbnail:val('p-thumbnail'),caption:val('p-caption'),cta:val('p-cta'),notes:val('p-notes')};
  trackEdits(isNew?null:S.data.projects[rec.id],n,P_FIELDS); put('projects',n); closeModal(); toast(isNew?'Project created.':'Project saved.'); }

const V_FIELDS=['label','title','platform','topic','views','viewsText','duration','ageText','source','capturedAt','url','notes'];
function videoModal(v,isNew){
  const body=`<div class="note">Record only what you can read in a screenshot or on the platform itself. Leave anything unreadable blank.</div>
  <fieldset><legend>Video</legend>${fld('Working name',inp('v-label',v.label),'wide')}${fld('Title as visible on the channel',inp('v-title',v.title,'text','Leave blank if not readable'),'wide')}
   ${fld('Platform',sel('v-platform',v.platform,PLATFORMS,'Not recorded'))}${fld('Topic',sel('v-topic',v.topic,TOPICS,'Unsorted'))}
   ${fld('Link (optional)',inp('v-url',v.url),'wide')}</fieldset>
  <fieldset><legend>Metrics as shown</legend>${fld('Views <small>e.g. 1.2K or 12,345</small>',inp('v-views',v.viewsText||(v.views!=null?String(v.views):'')))}${fld('Duration <small>e.g. 12:34</small>',inp('v-duration',v.duration))}
   ${fld('Upload age <small>e.g. 3 months ago</small>',inp('v-age',v.ageText))}${fld('Source',sel('v-source',v.source,SOURCES))}${fld('Capture date',inp('v-captured',v.capturedAt,'date'))}
   ${fld('Notes',ta('v-notes',v.notes,3),'wide')}</fieldset>`;
  const foot=`${isNew?'':`<button type="button" class="btn danger" data-a="del" data-c="videos" data-id="${esc(v.id)}">Delete</button><button type="button" class="btn" data-a="new-clip" data-kind="video" data-id="${esc(v.id)}">New clip from this</button>`}<span class="sp"></span><button type="button" class="btn" data-a="close">Cancel</button><button type="submit" class="btn pri">${isNew?'Add to archive':'Save changes'}</button>`;
  openModal(isNew?'Add published video':'Edit archive record',body,foot,{kind:'video',rec:v,isNew}); }
function blankVideo(o){return {id:uid('v'),label:'',title:'',platform:'',topic:'',views:null,viewsText:'',duration:'',ageText:'',source:'Manual entry',capturedAt:todayLux(),url:'',notes:'',edited:[],...o};}
function saveVideo(){ const {rec,isNew}=modalCtx; const lab=val('v-label')||val('v-title'); if(!lab){toast('Give the video a working name or a title.');$('#v-label').focus();return;}
  const vt=val('v-views'), views=parseViews(vt); if(vt&&views==null){toast('That view count could not be read. Use a form like 1.2K or 12,345.');$('#v-views').focus();return;}
  const n={...clone(rec),label:lab,title:val('v-title'),platform:val('v-platform'),topic:val('v-topic'),url:val('v-url'),viewsText:vt,views,duration:val('v-duration'),ageText:val('v-age'),source:val('v-source'),capturedAt:val('v-captured'),notes:val('v-notes')};
  trackEdits(isNew?null:S.data.videos[rec.id],n,V_FIELDS); put('videos',n); closeModal(); toast(isNew?'Video added to the archive.':'Archive record saved.'); }

const C_FIELDS=['title','sourceKind','sourceId','status','tcIn','tcOut','angle','hook','framing','subs','cover','pub','notes'];
function blankClip(o){return {id:uid('c'),title:'',sourceKind:'video',sourceId:'',status:'suggested',tcIn:'',tcOut:'',angle:'',hook:'',framing:'Reframe to 9:16 in CapCut. Keep the face in the upper-middle third and leave the bottom fifth free for captions.',subs:SUBS.map(t=>({t,done:false})),cover:'',pub:{youtube:{title:'',caption:'',date:''},tiktok:{caption:'',date:''},instagram:{caption:'',date:''}},notes:'',edited:[],...o};}
function clipModal(c,isNew){ const cur=c.sourceKind+':'+c.sourceId, pb=c.pub||{}, y=pb.youtube||{}, t=pb.tiktok||{}, i=pb.instagram||{};
  const o=(k,r)=>`<option value="${k}:${esc(r.id)}"${cur===k+':'+r.id?' selected':''}>${esc(r.title||r.label)}</option>`;
  const vids=all('videos').sort((a,b)=>(a.label||'').localeCompare(b.label||'')), prj=all('projects').sort((a,b)=>a.title.localeCompare(b.title));
  const body=`<fieldset><legend>Clip</legend>${fld('Clip name',inp('c-title',c.title),'wide')}
   ${fld('Original video',`<select id="c-source"><option value="">Choose the original…</option><optgroup label="Published videos">${vids.map(r=>o('video',r)).join('')}</optgroup><optgroup label="Pipeline projects">${prj.map(r=>o('project',r)).join('')}</optgroup></select>`,'wide')}
   ${fld('Status',sel('c-status',c.status,CLIP_STATUS),'wide')}
   ${fld('Source timecode in <small>e.g. 04:12</small>',inp('c-in',c.tcIn,'text','Leave blank until found'))}${fld('Source timecode out',inp('c-out',c.tcOut,'text','Leave blank until found'))}
   ${fld('Clip angle <small>what the clip is about, or what to look for</small>',ta('c-angle',c.angle,2),'wide')}
   ${fld('Standalone hook <small>must make sense without the long video</small>',ta('c-hook',c.hook,2),'wide')}
   ${fld('9:16 framing',ta('c-framing',c.framing,2),'wide')}
   <div class="fld wide"><span>CapCut subtitle checklist</span>${rowsEd('c-subs',c.subs||[],true,'Add check')}</div>
   ${fld('Canva cover',ta('c-cover',c.cover,2,'1080×1920, text inside the middle square'),'wide')}</fieldset>
  <fieldset><legend>Publishing details per platform</legend>
   <div class="plat"><h3>YouTube Shorts</h3><p>Title up to 100 characters. In YouTube Studio, set the original as the related video so viewers can reach it.</p>${fld('Title',inp('c-y-title',y.title))}${fld('Description',ta('c-y-cap',y.caption,2))}${fld('Planned date',inp('c-y-date',y.date,'date'))}</div>
   <div class="plat"><h3>TikTok</h3><p>Caption with a few specific hashtags. Say where the full video is, since captions cannot link out.</p>${fld('Caption',ta('c-t-cap',t.caption,3))}${fld('Planned date',inp('c-t-date',t.date,'date'))}</div>
   <div class="plat"><h3>Instagram Reels</h3><p>Upload the Canva cover and check the profile-grid crop keeps the face and text.</p>${fld('Caption',ta('c-i-cap',i.caption,3))}${fld('Planned date',inp('c-i-date',i.date,'date'))}</div>
   ${fld('Notes',ta('c-notes',c.notes,2),'wide')}</fieldset>`;
  const foot=`${isNew?'':`<button type="button" class="btn danger" data-a="del" data-c="clips" data-id="${esc(c.id)}">Delete</button>`}<span class="sp"></span><button type="button" class="btn" data-a="close">Cancel</button><button type="submit" class="btn pri">${isNew?'Create clip':'Save changes'}</button>`;
  openModal(isNew?'New Short / Reel':'Edit clip',body,foot,{kind:'clip',rec:c,isNew}); }
function saveClip(){ const {rec,isNew}=modalCtx; const title=val('c-title'), src=val('c-source'); if(!title){toast('Give the clip a name.');$('#c-title').focus();return;} if(!src){toast('Link the clip to its original video.');$('#c-source').focus();return;}
  const [sourceKind,sourceId]=src.split(':'); const status=val('c-status');
  if((status==='confirmed'||status==='cut'||status==='published')&&!val('c-in')){toast('Add the source timecode before marking the moment as found.');$('#c-in').focus();return;}
  const n={...clone(rec),title,sourceKind,sourceId,status,tcIn:val('c-in'),tcOut:val('c-out'),angle:val('c-angle'),hook:val('c-hook'),framing:val('c-framing'),subs:readRows('c-subs'),cover:val('c-cover'),
   pub:{youtube:{title:val('c-y-title'),caption:val('c-y-cap'),date:val('c-y-date')},tiktok:{caption:val('c-t-cap'),date:val('c-t-date')},instagram:{caption:val('c-i-cap'),date:val('c-i-date')}},notes:val('c-notes')};
  trackEdits(isNew?null:S.data.clips[rec.id],n,C_FIELDS); put('clips',n); closeModal(); toast(isNew?'Clip created and linked.':'Clip saved.'); }

function templateModal(id){ const t=tplOf(id);
  const body=`<fieldset><legend>${esc(t.name)}</legend>${fld('Hook',ta('t-hook',t.hook,2),'wide')}
   <div class="fld wide"><span>Shotlist</span>${rowsEd('t-shots',t.shotlist.map(x=>({t:x})),false,'Add shot')}</div>
   ${fld('Questions <small>one per line</small>',ta('t-questions',t.questions.join('\n'),4),'wide')}${fld('Title ideas <small>one per line</small>',ta('t-titles',t.titleIdeas.join('\n'),3),'wide')}
   ${fld('Canva thumbnail concept',ta('t-thumb',t.thumbnail,2),'wide')}${fld('Caption',ta('t-caption',t.caption,2),'wide')}${fld('Call to action',inp('t-cta',t.cta),'wide')}</fieldset>`;
  openModal('Edit template',body,`<span class="sp"></span><button type="button" class="btn" data-a="close">Cancel</button><button type="submit" class="btn pri">Save template</button>`,{kind:'template',id}); }
function saveTemplate(){ const id=modalCtx.id; put('templates',{id,hook:val('t-hook'),shotlist:readRows('t-shots').map(s=>s.t),questions:lines(val('t-questions')),titleIdeas:lines(val('t-titles')),thumbnail:val('t-thumb'),caption:val('t-caption'),cta:val('t-cta'),userCreated:true}); closeModal(); toast('Template saved.'); }

/* ---------- actions ---------- */
const A={
 close:closeModal,
 overlay(el,ev){ if(ev.target===el) closeModal(); },
 go(el){location.hash=el.dataset.r;},
 starter:loadStarter,
 pview(el){S.ui.pview=el.dataset.v;saveUI();$('#v-tools').innerHTML=V.pipeline.tools();renderBody();},
 'clear-filters'(){S.ui.f={q:'',type:'',topic:'',lang:'',platform:'',label:''};saveUI();$('#v-tools').innerHTML=V.pipeline.tools();renderBody();},
 'new-project'(el){projectModal(blankProject({filmDate:el.dataset.film||'',publishDate:el.dataset.pub||'',status:(el.dataset.film||el.dataset.pub)?'Planned':'Idea'}),true);},
 'edit-project'(el){const p=S.data.projects[el.dataset.id]; if(p) projectModal(clone(p),false);},
 'archive-project'(el){const p=S.data.projects[el.dataset.id]; if(!p) return;
   const vid=uid('v');
   all('clips').filter(c=>c.sourceKind==='project'&&c.sourceId===p.id).forEach(c=>put('clips',{...clone(c),sourceKind:'video',sourceId:vid},true));
   put('videos',blankVideo({id:vid,label:p.title,topic:p.topic,platform:(p.platforms||[])[0]||'',source:'Manual entry',notes:'Moved from the pipeline'+(p.publishDate?'. Planned publishing date was '+fmtFull(p.publishDate):'')+'. Add views from a screenshot.',plan:clone(p),userCreated:true}),true);
   del('projects',p.id); toast('Moved to the published archive.');},
 'new-video'(){videoModal(blankVideo({}),true);},
 'edit-video'(el){const v=S.data.videos[el.dataset.id]; if(v) videoModal(clone(v),false);},
 'new-clip'(el){clipModal(blankClip({sourceKind:el.dataset.kind||'video',sourceId:el.dataset.id||''}),true);},
 'edit-clip'(el){const c=S.data.clips[el.dataset.id]; if(c) clipModal(clone(c),false);},
 'use-template'(el){const t=tplOf(el.dataset.id); projectModal(blankProject({type:t.type,aspect:t.aspect,topic:t.id==='athlete'?'Athlete':'Football',hook:t.hook,shotlist:t.shotlist.map(x=>({t:x,done:false})),questions:[...t.questions],titleIdeas:[...t.titleIdeas],thumbnail:t.thumbnail,caption:t.caption,cta:t.cta,platforms:t.id==='short'?[...PLATFORMS]:['YouTube'],notes:'Created from the '+t.name+' template.'}),true);},
 'edit-template'(el){templateModal(el.dataset.id);},
 'reset-template'(el){ if(!el.dataset.armed){el.dataset.armed=1;el.textContent='Confirm reset';return;} del('templates',el.dataset.id); toast('Template reset to the default.');},
 'row-add'(el){const box=$('#'+el.dataset.t); box.insertAdjacentHTML('beforeend',rowHtml({t:'',done:false},!!box.dataset.check)); $('input[type=text]',box.lastElementChild).focus();},
 'row-del'(el){el.closest('.row').remove();},
 del(el){ if(!el.dataset.armed){el.dataset.armed=1;el.textContent='Confirm delete';return;} del(el.dataset.c,el.dataset.id); closeModal(); toast('Deleted.');},
 week(el){const d=+el.dataset.d; S.ui.week=d===0?'':addDays(S.ui.week||mondayOf(todayLux()),7*d); renderBody();},
 async 'export-file'(){ try{await S.dl.save({filename:`touchline-studio-backup-${todayLux()}.json`,data:JSON.stringify(exportObj(),null,1)});toast('Backup saved.');}catch(e){toast(e&&e.code==='declined'?'Save cancelled.':'The file could not be saved here. Use Copy backup JSON instead.');} },
 async 'export-copy'(){ const t=JSON.stringify(exportObj(),null,1); try{await navigator.clipboard.writeText(t);toast('Backup JSON copied. Paste it into a file and keep it safe.');}catch(e){const b=$('#export-box');b.hidden=false;b.value=t;b.select();toast('Copying is blocked here. The JSON is selected below: copy it by hand.');} },
 'export-show'(){const b=$('#export-box');b.hidden=false;b.value=JSON.stringify(exportObj(),null,1);b.select();},
 async import(el){ const mode=el.dataset.mode; const file=$('#import-file').files[0]; let text=$('#import-box').value.trim();
   if(!text&&!file){toast('Choose a backup file or paste the JSON first.');return;}
   if(mode==='replace'&&!el.dataset.armed){el.dataset.armed=1;el.textContent='Confirm: delete and replace';return;}
   try{ if(!text) text=await file.text(); toast(importData(JSON.parse(text),mode)); }catch(e){toast(e instanceof SyntaxError?'That text is not valid JSON.':e.message);} }
};
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-a]'); if(!el) return; const fn=A[el.dataset.a]; if(fn){ if(el.tagName==='BUTTON'&&el.type!=='submit') ev.preventDefault(); fn(el,ev);} });
document.addEventListener('submit',ev=>{ev.preventDefault(); if(!modalCtx) return; ({project:saveProject,video:saveVideo,clip:saveClip,template:saveTemplate})[modalCtx.kind](); });
document.addEventListener('keydown',ev=>{ if(ev.key==='Escape'&&modalCtx) closeModal(); });
document.addEventListener('input',ev=>{const el=ev.target; if(el.dataset.f){S.ui.f[el.dataset.f]=el.value;saveUI();renderBody();} else if(el.dataset.af){S.ui.af[el.dataset.af]=el.value;saveUI();renderBody();} else if('cf' in el.dataset){S.ui.cf=el.value;renderBody();} });
document.addEventListener('change',ev=>{const el=ev.target; if(el.dataset.aChange==='status'){const p=S.data.projects[el.dataset.id]; if(p&&p.status!==el.value){const n=clone(p);n.status=el.value;trackEdits(p,n,['status']);put('projects',n);toast('Moved to '+el.value+'.');}} });
/* drag and drop between columns */
let dragId=null;
document.addEventListener('dragstart',ev=>{const c=ev.target.closest&&ev.target.closest('.card'); if(!c) return; dragId=c.dataset.id; c.classList.add('dragging'); ev.dataTransfer.effectAllowed='move'; ev.dataTransfer.setData('text/plain',dragId);});
document.addEventListener('dragend',()=>{dragId=null;$$('.dragging').forEach(e=>e.classList.remove('dragging'));$$('.col.over').forEach(e=>e.classList.remove('over'));});
document.addEventListener('dragover',ev=>{const col=ev.target.closest&&ev.target.closest('.col'); if(!col||!dragId) return; ev.preventDefault(); $$('.col.over').forEach(e=>e!==col&&e.classList.remove('over')); col.classList.add('over');});
document.addEventListener('drop',ev=>{const col=ev.target.closest&&ev.target.closest('.col'); if(!col||!dragId) return; ev.preventDefault(); const p=S.data.projects[dragId], st=col.dataset.status; dragId=null;
  if(p&&p.status!==st){const n=clone(p);n.status=st;trackEdits(p,n,['status']);put('projects',n);toast('Moved to '+st+'.');} else renderBody();});

window.addEventListener('hashchange',renderRoute);
renderRoute(); initStore();
</script>
