<title>Touchline Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Nunito:wght@700;800;900&display=swap">
<style>
/* Layout: frosted sidebar beside a calm grey canvas of white rounded sheets; the sidebar folds into a frosted top bar on phones. */
:root{
  --bg:#f5f5f7; --surface:#ffffff; --surface-2:#f2f2f5; --fg:#1d1d1f; --mute:#6e6e73; --line:rgba(0,0,0,.09);
  --navy:#0b1f44; --navy-fg:#ffffff;
  --side:rgba(250,250,252,.72); --side-fg:#1d1d1f; --side-mute:#86868b; --side-active:rgba(11,31,68,.08);
  --accent:#1f8a4c; --accent-soft:#e3f6ea; --accent-fg:#ffffff;
  --blue:#0066cc; --blue-soft:#e5f0fb; --warn:#a05a00; --warn-soft:#fdf1dc; --bad:#d70015; --bad-soft:#fde7e9;
  --violet:#6b3fd4; --violet-soft:#efe9fc;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06); --shadow-lg:0 24px 70px rgba(0,0,0,.22);
  --glass:rgba(255,255,255,.72); --scrim:rgba(0,0,0,.32);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter","Helvetica Neue",system-ui,sans-serif;
  --ease:cubic-bezier(.32,.72,0,1); --gut:32px; --r:18px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#000000; --surface:#1c1c1e; --surface-2:#2c2c2e; --fg:#f5f5f7; --mute:#a1a1a6; --line:rgba(255,255,255,.12);
  --navy:#f5f5f7; --navy-fg:#0b1f44;
  --side:rgba(28,28,30,.72); --side-fg:#f5f5f7; --side-mute:#8e8e93; --side-active:rgba(255,255,255,.1);
  --accent:#30d158; --accent-soft:#12331f; --accent-fg:#04220f;
  --blue:#4da3ff; --blue-soft:#10294a; --warn:#ffb340; --warn-soft:#3a2a0c; --bad:#ff6961; --bad-soft:#40161a;
  --violet:#b89cff; --violet-soft:#2a2050;
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 24px 70px rgba(0,0,0,.6); --glass:rgba(28,28,30,.72); --scrim:rgba(0,0,0,.55); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1c1c1e; --surface-2:#2c2c2e; --fg:#f5f5f7; --mute:#a1a1a6; --line:rgba(255,255,255,.12);
  --navy:#f5f5f7; --navy-fg:#0b1f44;
  --side:rgba(28,28,30,.72); --side-fg:#f5f5f7; --side-mute:#8e8e93; --side-active:rgba(255,255,255,.1);
  --accent:#30d158; --accent-soft:#12331f; --accent-fg:#04220f;
  --blue:#4da3ff; --blue-soft:#10294a; --warn:#ffb340; --warn-soft:#3a2a0c; --bad:#ff6961; --bad-soft:#40161a;
  --violet:#b89cff; --violet-soft:#2a2050;
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 24px 70px rgba(0,0,0,.6); --glass:rgba(28,28,30,.72); --scrim:rgba(0,0,0,.55); color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.47 var(--font);-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:700}
h1{font-size:34px;letter-spacing:-.03em;line-height:1.1} h2{font-size:19px;letter-spacing:-.02em;font-weight:650} h3{font-size:13px;font-weight:600;color:var(--mute)}
p{margin:0}
a{color:var(--blue);text-decoration:none} a:hover{text-decoration:underline}
:focus-visible{outline:3px solid color-mix(in srgb,var(--blue) 55%,transparent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* Lock screen */
.lock{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));
  background:radial-gradient(1200px 700px at 20% -10%,color-mix(in srgb,var(--accent) 16%,transparent),transparent 60%),radial-gradient(900px 600px at 110% 110%,color-mix(in srgb,var(--blue) 14%,transparent),transparent 60%),var(--bg)}
.lock-card{width:min(360px,100%);display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;background:var(--glass);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);
  border:1px solid var(--line);border-radius:28px;padding:36px 28px 28px;box-shadow:var(--shadow-lg)}
.lock-card h1{font-size:26px} .lock-card p{color:var(--mute)}
.lock-card input{width:100%;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:0 16px;text-align:center;font-size:16px}
.lock-card .btn{width:100%;height:46px;border-radius:14px;font-size:16px}
.lock-err{min-height:1.4em;color:var(--bad)!important;font-size:13px}
.lock.leaving{opacity:0;transform:scale(1.04);pointer-events:none}
.lock-mark{width:64px;height:64px;border-radius:18px;background:var(--navy);display:grid;place-items:center;box-shadow:var(--shadow)}
.lock-mark i{width:30px;height:30px;border:2.5px solid var(--accent);border-radius:8px;position:relative;display:block}
.lock-mark i::before{content:"";position:absolute;left:50%;top:0;bottom:0;margin-left:-1.25px;border-left:2.5px solid var(--accent)}

.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100%}
.side{background:var(--side);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);color:var(--side-fg);border-right:1px solid var(--line);
  position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;gap:22px;padding:24px 12px 18px max(12px,env(safe-area-inset-left,0px));overflow:auto;z-index:5}
.brand{display:flex;align-items:center;gap:11px;padding:0 10px}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--navy);position:relative;flex:none}
.brand-mark::before{content:"";position:absolute;inset:8px;border:2px solid var(--accent);border-radius:4px}
.brand-mark::after{content:"";position:absolute;left:50%;top:8px;bottom:8px;margin-left:-1px;border-left:2px solid var(--accent)}
.brand b{font-size:16px;font-weight:700;letter-spacing:-.02em;line-height:1.15;display:block}
.brand small{color:var(--side-mute);font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;color:var(--side-fg);font-weight:500;white-space:nowrap;text-decoration:none}
.nav a:hover{background:var(--side-active);text-decoration:none}
.nav a[aria-current="page"]{background:var(--navy);color:var(--navy-fg);font-weight:600;box-shadow:var(--shadow)}
.nav .cnt{font-size:12px;color:var(--side-mute);font-variant-numeric:tabular-nums}
.nav a[aria-current="page"] .cnt{color:inherit;opacity:.7}
.side-foot{margin-top:auto;font-size:12px;color:var(--side-mute);padding:0 10px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.sync{display:inline-flex;align-items:center;gap:7px;color:var(--side-fg)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--side-mute);flex:none}
.sync.ok i{background:#30d158;box-shadow:0 0 0 3px color-mix(in srgb,#30d158 25%,transparent)} .sync.local i{background:#ff9f0a}

.main{min-width:0;padding-block:36px 64px;padding-left:max(var(--gut),env(safe-area-inset-left,0px));padding-right:max(var(--gut),env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
.head p{color:var(--mute);max-width:68ch;font-size:16px;margin-top:6px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tools input[type=search],.tools select{height:38px;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:0 12px;min-width:0}
.tools input[type=search]{flex:1 1 180px;max-width:280px}
.tools .sp{flex:1}
.btn{height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:550;white-space:nowrap}
.btn:hover{background:var(--surface-2)} .btn:active{transform:scale(.97)}
.btn.pri{background:var(--navy);border-color:transparent;color:var(--navy-fg);font-weight:600}
.btn.pri:hover{filter:brightness(1.15)}
.btn.danger{color:var(--bad)} .btn.danger[data-armed]{background:var(--bad);color:#fff;border-color:transparent}
.btn.sm{height:30px;padding:0 12px;font-size:13px}
.seg{display:inline-flex;border-radius:11px;background:color-mix(in srgb,var(--fg) 8%,transparent);padding:3px;gap:2px;max-width:100%;overflow-x:auto}
.seg button{border:0;background:none;height:32px;padding:0 14px;cursor:pointer;font-weight:550;color:var(--fg);border-radius:8px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.14)}

.note{background:var(--surface);border-radius:var(--r);padding:14px 18px;color:var(--mute);max-width:100ch;box-shadow:var(--shadow)}
.note.warn{background:var(--warn-soft);box-shadow:none} .note b{color:var(--fg)}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:36px 20px;text-align:center;color:var(--mute);display:flex;flex-direction:column;gap:12px;align-items:center}

.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--mute);white-space:nowrap}
.tag.prev{background:var(--blue-soft);color:var(--blue)} .tag.new{background:var(--violet-soft);color:var(--violet)}
.tag.verify{background:var(--warn-soft);color:var(--warn)} .tag.ok{background:var(--accent-soft);color:var(--accent)} .tag.bad{background:var(--bad-soft);color:var(--bad)}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tags .btn{white-space:normal;height:auto;min-height:30px;padding-block:5px;text-align:left;border-radius:14px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none;background:var(--mute)}
.dot.high{background:var(--bad)} .dot.medium{background:#ff9f0a} .dot.low{background:var(--line)}

/* Kanban */
.board-wrap{overflow-x:auto;padding-bottom:10px;margin-inline:-6px;padding-inline:6px}
.board{display:grid;grid-template-columns:repeat(6,minmax(236px,1fr));gap:12px;min-width:0}
.col{background:color-mix(in srgb,var(--fg) 4%,transparent);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:180px;border:1.5px solid transparent}
.col.over{border-color:var(--accent);background:var(--accent-soft)}
.col-h{display:flex;justify-content:space-between;align-items:center;font-weight:650;padding:4px 6px;letter-spacing:-.01em}
.col-h span{color:var(--mute);font-size:13px;font-weight:500}
.card{background:var(--surface);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow);cursor:grab}
.card:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(0,0,0,.05),0 14px 30px rgba(0,0,0,.1)}
.card.dragging{opacity:.35;transform:scale(.97)}
.card-t{font-weight:600;line-height:1.3;background:none;border:0;padding:0;text-align:left;cursor:pointer;overflow-wrap:anywhere}
.card-t:hover{color:var(--blue)}
.meta{font-size:13px;color:var(--mute);overflow-wrap:anywhere}
.card-f{display:flex;gap:6px;align-items:center;justify-content:space-between}
.card-f select,td select{height:28px;border:0;border-radius:8px;background:var(--surface-2);font-size:13px;padding:0 6px;max-width:60%}
.col-empty{font-size:13px;color:var(--mute);text-align:center;padding:18px 4px}

/* Tables */
.tbl-wrap{overflow-x:auto;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;min-width:760px}
th{font-size:12px;color:var(--mute);text-align:left;font-weight:600;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:color-mix(in srgb,var(--fg) 2.5%,transparent)}
td.r,th.r{text-align:right}
td.t{max-width:380px}
.linkish{background:none;border:0;padding:0;font-weight:600;cursor:pointer;text-align:left;overflow-wrap:anywhere}
.linkish:hover{color:var(--blue)}
.blank{color:color-mix(in srgb,var(--mute) 70%,transparent)}

/* Panels */
.grid{display:grid;gap:16px}
.grid.c2{grid-template-columns:repeat(auto-fit,minmax(min(360px,100%),1fr))}
.grid.c3{grid-template-columns:repeat(auto-fit,minmax(min(290px,100%),1fr))}
.panel{background:var(--surface);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:var(--shadow)}
.panel h2 small{font-weight:500;font-size:13px;color:var(--mute);margin-left:8px;letter-spacing:0}
.panel ul,.panel ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.kind{font-size:12px;font-weight:700;letter-spacing:.02em}
.kind.obs{color:var(--accent)} .kind.hyp{color:var(--violet)} .kind.exp{color:var(--blue)}
.bars{display:flex;flex-direction:column;gap:12px}
.bar-row{display:grid;grid-template-columns:96px minmax(0,1fr);gap:4px 12px;align-items:center}
.bar-row .lbl{font-weight:600}
.bar-track{background:var(--surface-2);border-radius:6px;height:12px;overflow:hidden}
.bar-fill{background:var(--accent);height:100%;border-radius:6px;min-width:3px;transform-origin:left;animation:grow .7s var(--ease) both}
.bar-meta{grid-column:2;font-size:13px;color:var(--mute)}
.chan{gap:6px}
.chan .stats{display:flex;flex-wrap:wrap;gap:18px;margin-top:4px}
.chan .stat b{display:block;font-size:26px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.chan .stat span{font-size:12px;color:var(--mute)}

/* Calendar */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.day{background:var(--surface);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:6px;min-height:190px;min-width:0;box-shadow:var(--shadow);border:1.5px solid transparent}
.day.today{border-color:var(--accent)}
.day-h{display:flex;justify-content:space-between;align-items:baseline;font-weight:650}
.day-h span{font-weight:500;font-size:12px;color:var(--mute)}
.day.today .day-h span{color:var(--accent);font-weight:700}
.ev{border:0;text-align:left;border-radius:9px;padding:6px 8px;font-size:13px;font-weight:550;cursor:pointer;overflow-wrap:anywhere;line-height:1.3}
.ev:hover{filter:brightness(.96)}
.ev.film{background:var(--blue-soft);color:var(--blue)} .ev.pub{background:var(--accent-soft);color:var(--accent)}
.ev b{display:block;font-size:10.5px;letter-spacing:.03em;opacity:.8}
.day-add{margin-top:auto;display:flex;gap:4px;flex-wrap:wrap;opacity:.55}
.day:hover .day-add,.day:focus-within .day-add{opacity:1}
.day-add button{border:0;background:var(--surface-2);border-radius:999px;font-size:12px;padding:3px 9px;cursor:pointer;color:var(--mute)}
.day-add button:hover{color:var(--fg)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mute);align-items:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}

.todos{display:flex;flex-direction:column;gap:6px}
.todo{display:flex;gap:9px;align-items:flex-start;background:var(--surface-2);border-radius:10px;padding:7px 9px;font-size:13.5px;line-height:1.3;cursor:pointer;overflow-wrap:anywhere;min-width:0}
.todo input{width:17px;height:17px;flex:none;margin:1px 0 0;accent-color:var(--accent)}
.todo small{display:block;color:var(--mute);font-size:11.5px;margin-top:2px}
.todo.done span{color:var(--mute);text-decoration:line-through}
.today-panel .todo{background:var(--surface-2);font-size:15px;padding:10px 12px}
.today-panel .todo input{width:20px;height:20px}
.row.task{flex-wrap:wrap} .row.task input[type=date]{flex:0 0 150px;width:150px} .row.task input[type=text]{flex:1 1 200px}
/* Action cards */
.act{border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:7px;background:var(--surface-2)}
.act .what{font-size:12px;font-weight:700;color:var(--accent)}
.act ul{font-size:13.5px;color:var(--mute);gap:4px}
.lane h2{display:flex;justify-content:space-between;align-items:baseline}

/* Modal sheet */
.overlay{position:fixed;inset:0;background:var(--scrim);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:flex-start;justify-content:center;z-index:50;
  padding:max(20px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));overflow:auto;animation:fade .25s ease both}
.modal{background:var(--surface);border-radius:22px;width:min(820px,100%);display:flex;flex-direction:column;box-shadow:var(--shadow-lg);margin:auto;animation:sheet .45s var(--ease) both}
.modal-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:18px 22px;border-bottom:1px solid var(--line)}
.modal-b{padding:20px 22px;display:flex;flex-direction:column;gap:22px}
.modal-f{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;padding:14px 22px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:0 0 22px 22px}
.modal-f .sp{flex:1}
.x{border:0;background:var(--surface-2);width:30px;height:30px;border-radius:50%;font-size:18px;line-height:1;cursor:pointer;color:var(--mute);display:grid;place-items:center;flex:none}
.x:hover{color:var(--fg)}
fieldset{border:0;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:14px;min-width:0}
legend{font-weight:650;font-size:13px;padding:0 0 10px;color:var(--mute)}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.wide{grid-column:1/-1}
.fld>span{font-size:13px;font-weight:600;color:var(--mute)}
.fld input[type=text],.fld input[type=date],.fld select,.fld textarea{border:1px solid transparent;background:var(--surface-2);border-radius:11px;padding:9px 12px;width:100%;min-width:0}
.fld input:focus,.fld select:focus,.fld textarea:focus{background:var(--surface);border-color:var(--blue);outline:3px solid color-mix(in srgb,var(--blue) 25%,transparent)}
.fld textarea{resize:vertical;line-height:1.45}
.fld small{color:var(--mute);font-size:12px;font-weight:400}
.chks{display:flex;flex-wrap:wrap;gap:6px}
.chk{display:inline-flex;gap:7px;align-items:center;background:var(--surface-2);border-radius:999px;padding:6px 13px;cursor:pointer;font-size:14px}
.chk:has(input:checked){background:var(--accent-soft);color:var(--accent);font-weight:600}
.chk input{accent-color:var(--accent)}
.rows{display:flex;flex-direction:column;gap:6px}
.row{display:flex;gap:8px;align-items:center}
.row input[type=text]{flex:1}
.row input[type=checkbox]{width:20px;height:20px;flex:none;accent-color:var(--accent)}
.plat{background:var(--surface-2);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.plat h3{color:var(--fg);font-size:15px} .plat p{font-size:13px;color:var(--mute)}
.plat .fld input,.plat .fld textarea{background:var(--surface)}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--glass);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);color:var(--fg);border:1px solid var(--line);
  padding:11px 18px;border-radius:999px;z-index:60;box-shadow:var(--shadow-lg);max-width:calc(100% - 32px);font-weight:550;animation:toast .45s var(--ease) both}
textarea.code{font:12px/1.4 ui-monospace,"SF Mono",Menlo,Consolas,monospace;width:100%;border:0;border-radius:12px;background:var(--surface-2);padding:12px;min-height:120px}

@keyframes fade{from{opacity:0}}
@keyframes sheet{from{opacity:0;transform:translateY(40px) scale(.97)}}
@keyframes toast{from{opacity:0;transform:translate(-50%,20px)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.enter{animation:rise .5s var(--ease) both}
.shake{animation:shake .4s ease}
.btn,.nav a,.card,.seg button,.ev,.x,.fld input,.fld select,.fld textarea,.day-add{transition:background .2s ease,color .2s ease,transform .25s var(--ease),box-shadow .25s ease,filter .2s ease,opacity .2s ease,border-color .2s ease}

function exportObj(){const o={app:'touchline-studio',version:1,exportedAt:new Date().toISOString()};COLLS.forEach(c=>o[c]=all(c));return o;}
const blankVal=v=>v==null||v===''||(Array.isArray(v)&&!v.length);
function mergeRecord(cur,inc){ // keeps anything the user edited; fills or updates the rest
  const out=clone(cur), locked=new Set(cur.userCreated?Object.keys(cur):(cur.edited||[])); let changed=0,kept=0;
  for(const k of Object.keys(inc)){ if(k==='id'||k==='edited'||k==='updatedAt'||k==='userCreated') continue;
    if(JSON.stringify(cur[k])===JSON.stringify(inc[k])) continue;
    if(locked.has(k)&&!blankVal(cur[k])){kept++;continue;}
    if(blankVal(inc[k])&&!blankVal(cur[k])) continue;
    out[k]=clone(inc[k]); changed++; }
  return {out,changed,kept}; }
function importData(obj,mode){
  if(!obj||obj.app!=='touchline-studio') throw new Error('This is not a Touchline Studio backup file.');
  let added=0,updated=0,kept=0;
  if(mode==='replace') COLLS.forEach(c=>all(c).forEach(r=>del(c,r.id,true)));
  COLLS.forEach(c=>(obj[c]||[]).forEach(r=>{ if(!r||!r.id||!/^[A-Za-z0-9_\-.~:@+]{1,200}$/.test(r.id)) return;
    const cur=S.data[c][r.id];
    if(!cur){put(c,clone(r),true);added++;}
    else{const m=mergeRecord(cur,r); kept+=m.kept; if(m.changed){put(c,m.out,true);updated++;}} }));
  renderData();
  return `Imported: ${added} added, ${updated} updated${kept?`, ${kept} of your edited fields kept as they were`:''}.`; }
async function loadStarter(){ if(window.__TL_SEED){toast(importData(window.__TL_SEED,'merge'));return;} try{const r=await fetch('seed.json'); if(!r.ok) throw 0; toast(importData(await r.json(),'merge'));}catch(e){toast('The starter plan could not be loaded here. Use Import on the Data & backup page.');} }

function filteredProjects(){ const f=S.ui.f,q=f.q.trim().toLowerCase();
  return all('projects').filter(p=>(!q||[p.title,p.people,p.location,p.hook,p.notes,p.type].join(' ').toLowerCase().includes(q))
    &&(!f.type||p.type===f.type)&&(!f.topic||p.topic===f.topic)&&(!f.lang||(p.languages||[]).includes(f.lang))&&(!f.platform||(p.platforms||[]).includes(f.platform))
    &&(!f.label||(f.label==='verify'?p.verify:p.origin===f.label)))
  .sort((a,b)=>({high:0,medium:1,low:2}[a.priority]-({high:0,medium:1,low:2})[b.priority])||(a.publishDate||'9').localeCompare(b.publishDate||'9')||a.title.localeCompare(b.title)); }

function originTag(p){return p.origin==='new'?'<span class="tag new">New suggestion</span>':p.origin==='previous'?'<span class="tag prev">Previous idea</span>':'<span class="tag">Added by you</span>';}

function genPlan(film,pub,styleId){ const T=[], st=STYLES.find(x=>x.id===styleId), add=(d,t)=>T.push({t,date:d,done:false});
  if(film){add(addDays(film,-3),'Confirm people, location and filming permission');add(addDays(film,-1),'Charge batteries, clear memory cards, read the shotlist');add(film,'Film: follow the shotlist');add(addDays(film,1),'Back up the footage and mark the best moments');}
  if(pub){add(addDays(pub,-4),'Rough cut in CapCut');add(addDays(pub,-2),'Fine cut'+(st?': work through the '+st.name+' style checklist':'')+', proofread subtitles');add(addDays(pub,-1),'Thumbnail in Canva, final title, caption and call to action');add(pub,'Publish, then post the teaser on TikTok and Instagram');add(addDays(pub,1),'Cut Shorts and Reels from the video');add(addDays(pub,7),'Record the 7-day views in the archive');add(addDays(pub,30),'Record the 30-day views in the archive');}

function allTasks(){ const out=[]; all('projects').forEach(p=>(p.tasks||[]).forEach((k,i)=>{if(k.date) out.push({...k,i,p});})); return out.sort((a,b)=>a.date.localeCompare(b.date)); }
const todoHtml=(k,showDate)=>`<label class="todo${k.done?' done':''}"><input type="checkbox" data-a-change="task" data-id="${esc(k.p.id)}" data-i="${k.i}"${k.done?' checked':''}><span>${esc(k.t)}<small>${showDate?fmtShort(k.date)+' · ':''}${esc(k.p.title)}</small></span></label>`;
function urgency(d){return d==null?0:d<0?40:d<=2?30:d<=7?20:d<=14?10:0;}
function when(d,verb){return d==null?'':d<0?`${verb} date passed ${-d} day${d===-1?'':'s'} ago`:d===0?`${verb} date is today`:`${verb} date in ${d} day${d===1?'':'s'}`;}
function buildActions(){ const t=todayLux(), out=[];
  all('projects').forEach(p=>{ const pr={high:30,medium:15,low:5}[p.priority]??15, dF=p.filmDate?diffDays(t,p.filmDate):null, dP=p.publishDate?diffDays(t,p.publishDate):null;
    const R=[`${label(PRIOS,p.priority)} priority`]; const needsCollab=p.collab==='idea'||p.collab==='asked';
    const collabLine=p.collab==='confirmed'?'Collaboration is confirmed':p.collab==='asked'?'Asked, but the collaboration is not confirmed':p.collab==='idea'?'Still an idea: nobody has been asked':'';
    if(p.verify) out.push({lane:'check',p,score:55,what:'Verify status',reasons:[p.verifyNote||'Publication is not confirmed.']});
    let a=null;
    if(p.status==='Idea'&&!p.verify){ a={lane:needsCollab?'check':'film',score:pr,what:needsCollab?'Ask and confirm':'Set a filming date',reasons:[...R,'Status: Idea, nothing filmed']};
      if(collabLine)a.reasons.push(collabLine); if(p.material)a.reasons.push('Available material: '+p.material); if(dF!=null){a.reasons.push(when(dF,'Filming'));a.score+=urgency(dF);} }
    else if(p.status==='Planned'){ a={lane:'film',score:pr+20+urgency(dF),what:'Film',reasons:[...R,'Status: Planned',dF==null?'No filming date set yet':when(dF,'Filming')]};
      a.reasons.push((p.shotlist||[]).length?`Shotlist has ${p.shotlist.length} shots`:'Shotlist is empty'); if(collabLine)a.reasons.push(collabLine); if(needsCollab){a.what='Confirm before filming';} }
    else if(p.status==='Filmed'){ a={lane:'edit',score:pr+40+urgency(dP),what:'Start the edit',reasons:[...R,'Footage is filmed and waiting',dP==null?'No publishing date set yet':when(dP,'Publishing')]}; }
    else if(p.status==='Editing'){ a={lane:'edit',score:pr+50+urgency(dP),what:'Finish the edit',reasons:[...R,'Edit already in progress',dP==null?'No publishing date set yet':when(dP,'Publishing')]}; }
    else if(p.status==='Ready'){ a={lane:'post',score:pr+60+urgency(dP),what:'Publish',reasons:[...R,'Edit is finished',dP==null?'No publishing date set yet':when(dP,'Publishing')]};
      const miss=[!p.caption&&'caption',!p.thumbnail&&'thumbnail concept',!(p.titleIdeas||[]).length&&'title'].filter(Boolean); if(miss.length)a.reasons.push('Still missing: '+miss.join(', ')); }
    else if(p.status==='Published'){ a={lane:'post',score:12,what:'Move to archive, plan Shorts',reasons:['Marked as published','Record views from a screenshot once it has run for a while']}; }
    if(a){a.p=p;out.push(a);} });
  return out.sort((a,b)=>b.score-a.score||a.p.title.localeCompare(b.p.title)); }

  const useRate=wv.length>0&&wv.every(v=>rate(v)!=null), val=c=>useRate?c.rmed:c.med, max=Math.max(1,...cats.map(c=>val(c)||0));
  const obs=[`${wv.length} of ${vs.length} ${seg[1]} records have a view count. Median: ${wv.length?nf(median(wv.map(v=>v.views))):'n/a'} views.`];
  if(wv.length){const top=wv[0];obs.push(`Most viewed: “${(top.label||top.title).slice(0,90)}” with ${nf(top.views)} views${whenText(top)?` (${top.publishedAt?'published '+whenText(top):'shown as '+whenText(top)})`:''}.`);}
  const rk=cats.filter(c=>val(c)!=null).sort((a,b)=>val(b)-val(a));
  if(rk.length>=2) obs.push(`By median ${useRate?'views per month of age':'views'}: ${rk.map(c=>`${c.t} ${nf(val(c))} (${c.nv})`).join(', ')}. The number in brackets is how many videos.${rk.some(c=>c.nv<3)?' Groups with fewer than three videos are too small to trust.':''}`);
  const lk=wv.filter(v=>v.likes!=null&&v.views>0); if(lk.length>=3) obs.push(`Likes per 100 views, median across ${lk.length} posts: ${median(lk.map(v=>v.likes/v.views*100)).toFixed(1)}.`);
  const young=wv.filter(v=>{const m=ageMonths(v);return m!=null&&m<1;}); if(young.length) obs.push(`${young.length} post${young.length===1?' is':'s are'} under a month old and still collecting views.`);
  if(!useRate&&wv.length) obs.push('Upload age is missing for some or all of these, so they are compared on total views. Older posts have had more time to collect them.');
  if(wv.length<3) obs.push('There is not enough data here yet to compare formats.');
  const chans=['youtube','tiktok','instagram'].map(id=>S.data.channels[id]).filter(Boolean), ch=S.data.channels[seg[2]], note=S.data.notes.analysis;
  const shown=S.ui.rankAll?wv:wv.slice(0,12), li=a=>a.map(o=>`<li>${esc(o)}</li>`).join('');
  return `<div class="grid">
  ${chans.length?`<div class="grid c3">${chans.map(c=>`<section class="panel chan"><h2>${esc(c.name)}<small>${esc(c.handle||'')}</small></h2>${c.display&&c.display!==c.handle?`<p class="meta">Channel name shown: ${esc(c.display)}</p>`:''}
    <div class="stats">${(c.stats||[]).map(([l,v])=>`<div class="stat"><b class="num">${esc(v)}</b><span>${esc(l)}</span></div>`).join('')}</div>
    <p class="meta">${esc(c.source||'')}${c.capturedAt?' · captured '+fmtFull(c.capturedAt):''}${c.url?` · <a href="${esc(c.url)}" target="_blank" rel="noopener">Open</a>`:''}</p></section>`).join('')}</div>`:''}
  <div class="note"><b>What this covers.</b> ${ch&&ch.coverage?esc(ch.coverage)+' ':''}Click-through rate, retention, watch time and the footage itself are not visible from public pages; for those, open YouTube Studio or the TikTok and Instagram insights. Topics were assigned from titles and captions only.</div>
   <section class="panel"><h2>${esc(seg[1])} ranked by views <small>${wv.length} with data</small></h2>
    ${wv.length?`<div class="tbl-wrap" style="box-shadow:none"><table style="min-width:640px"><thead><tr><th>#</th><th>Video</th><th>Topic</th><th class="r">Views</th><th>Published</th><th class="r">≈ per month</th></tr></thead><tbody>${shown.map((v,i)=>{const r=rate(v);return `<tr><td class="num">${i+1}</td><td class="t"><button class="linkish" data-a="edit-video" data-id="${esc(v.id)}">${esc((v.label||v.title).slice(0,80))}</button></td><td>${topicChip(v.topic)||'<span class="blank">unsorted</span>'}</td><td class="r num">${nf(v.views)}</td><td class="num">${esc(whenText(v))||'<span class="blank">not shown</span>'}</td><td class="r num">${r==null?'<span class="blank">n/a</span>':nf(r)}</td></tr>`;}).join('')}</tbody></table></div>
    ${wv.length>12?`<div><button class="btn sm" data-a="rank-all">${S.ui.rankAll?'Show top 12':'Show all '+wv.length}</button></div>`:''}`
    :`<div class="empty">No view counts recorded here yet.<button class="btn" data-a="go" data-r="archive">Open the archive</button></div>`}</section>
   <div class="grid c2">
   <section class="panel"><h2>By content area <small>${useRate?'median views per month of age':'median views'}</small></h2>
    <div class="bars">${cats.map(c=>`<div class="bar-row"><span class="lbl">${esc(c.t)}</span><div class="bar-track">${val(c)!=null?`<div class="bar-fill" style="width:${(val(c)/max*100).toFixed(1)}%"></div>`:''}</div>
     <div class="bar-meta num">${c.n} post${c.n===1?'':'s'}${c.nv?` · median ${nf(c.med)} views${c.rmed!=null?` · ≈ ${nf(c.rmed)} per month`:''}`:' · no views recorded'}</div></div>`).join('')||'<div class="blank">No records.</div>'}</div></section>
   <section class="panel"><span class="kind obs">Observations · ${esc(seg[1])}, from the recorded numbers</span><ul>${li(obs)}</ul></section></div>
  ${note?`<section class="panel"><span class="kind obs">Observations across all three channels · ${esc(note.by||'')} ${note.date?'on data captured '+fmtFull(note.date):''}</span><ul>${li(note.observations||[])}</ul></section>`:''}
  <div class="grid c2">
   <section class="panel"><span class="kind hyp">Hypotheses · untested, to check against your data</span><ul>${li(note&&note.hypotheses||DEF_HYP)}</ul></section>
   <section class="panel"><span class="kind exp">Practical experiments</span><ul>${li(note&&note.experiments||DEF_EXP)}</ul></section>
  </div></div>`; }};

V.calendar={title:'Calendar',sub:'Your week: what to do, film and post. Luxembourg time.',
 tools(){return `<button class="btn" data-a="week" data-d="-1" aria-label="Previous week">← Previous</button><button class="btn" data-a="week" data-d="0">Today</button><button class="btn" data-a="week" data-d="1" aria-label="Next week">Next →</button>
  <strong id="week-label" class="num" style="margin-left:6px"></strong><span class="sp"></span>
  <span class="legend"><span><i style="background:var(--blue)"></i>Filming</span><span><i style="background:var(--accent)"></i>Publishing</span><span><i style="background:var(--mute)"></i>Step to do</span></span>`;},
 body(){ const t=todayLux(), mon=S.ui.week||mondayOf(t), days=[...Array(7)].map((_,i)=>addDays(mon,i)), ps=all('projects');
  const wl=$('#week-label'); if(wl) wl.textContent=`Week ${isoWeek(mon)} · ${fmtShort(mon)} – ${fmtFull(days[6])}`;
  const un=ps.filter(p=>p.status!=='Published'&&!p.filmDate&&!p.publishDate), tasks=allTasks(), due=tasks.filter(k=>k.date===t), late=tasks.filter(k=>k.date<t&&!k.done), next=tasks.filter(k=>k.date>t&&!k.done).slice(0,4);
  return `<div class="grid"><section class="panel today-panel"><h2>What to do today<small>${fmt(t,{weekday:'long',day:'numeric',month:'long'})}</small></h2>
    ${due.length||late.length?`<div class="todos">${late.map(k=>todoHtml(k,true)).join('')}${due.map(k=>todoHtml(k,false)).join('')}</div>${late.length?`<p class="meta">${late.length} step${late.length===1?' is':'s are'} overdue and listed first.</p>`:''}`
    :`<p class="meta">${tasks.length?'Nothing is due today.':'No steps planned yet. Open a project, set its filming and publishing dates, then press “Generate plan from dates”: every step appears here on its day.'}</p>`}
    ${next.length?`<div><h3>Coming up</h3><div class="todos">${next.map(k=>todoHtml(k,true)).join('')}</div></div>`:''}</section>
   <div class="week">${days.map(d=>{const film=ps.filter(p=>p.filmDate===d), pub=ps.filter(p=>p.publishDate===d), dt=tasks.filter(k=>k.date===d);
   return `<section class="day${d===t?' today':''}" data-date="${d}"><div class="day-h">${fmt(d,{weekday:'short'})} ${fmt(d,{day:'numeric'})}<span>${d===t?'Today':fmt(d,{month:'short'})}</span></div>
    ${film.map(p=>`<button class="ev film" data-a="edit-project" data-id="${esc(p.id)}"><b>Film</b>${esc(p.title)}</button>`).join('')}
    ${pub.map(p=>`<button class="ev pub" data-a="edit-project" data-id="${esc(p.id)}"><b>Publish</b>${esc(p.title)}</button>`).join('')}
    ${dt.map(k=>todoHtml(k,false)).join('')}
    <div class="day-add"><button data-a="new-project" data-film="${d}">+ Filming</button><button data-a="new-project" data-pub="${d}">+ Publishing</button></div></section>`;}).join('')}</div>
   <section class="panel"><h2>Not scheduled yet <small>${un.length}</small></h2>${un.length?`<p class="meta">Open a project to give it a filming or publishing date.</p><div class="tags">${un.map(p=>`<button class="btn sm" data-a="edit-project" data-id="${esc(p.id)}">${esc(p.title)}</button>`).join('')}</div>`:'<p class="meta">Every active project has at least one date.</p>'}</section></div>`; }};

V.actions={title:'Next up',sub:'What to film, edit and post next, and why.',
 tools(){return '';},
 body(){ const acts=buildActions(); if(!acts.length) return isEmpty()?starter():`<div class="empty">No active projects to rank.</div>`;
  const card=a=>`<div class="act"><span class="what">${esc(a.what)}</span><button class="linkish" data-a="edit-project" data-id="${esc(a.p.id)}">${esc(a.p.title)}</button>${projectTags(a.p)}<ul>${a.reasons.filter(Boolean).map(r=>`<li>${esc(r)}</li>`).join('')}</ul></div>`;
  const lane=(k,h,emp)=>{const l=acts.filter(a=>a.lane===k);return `<section class="panel lane"><h2>${h}<small>${l.length}</small></h2>${l.map(card).join('')||`<p class="meta">${emp}</p>`}</section>`;};
  const doable=acts.filter(a=>a.lane!=='check').slice(0,3);
  return `<div class="grid"><div class="note"><b>How this is ranked.</b> Projects closer to publishing come first (Ready, then Editing, Filmed, Planned, Idea), because finished material is worth more than a new shoot. Dates within 14 days and overdue dates push a project up, and so does a higher priority. A project marked “Idea, nobody asked” is a suggestion, not an agreed collaboration, and goes to “Confirm and verify” until you change its collaboration status.</div>
   ${doable.length?`<section class="panel"><h2>Do next</h2><div class="grid c3">${doable.map(card).join('')}</div></section>`:''}
   <div class="grid c2">${lane('film','Film next','Nothing is planned or ready to schedule. Confirm an idea first.')}${lane('edit','Edit next','No footage is waiting. Projects appear here once their status is Filmed or Editing.')}${lane('post','Post next','Nothing is ready to publish.')}${lane('check','Confirm and verify','Nothing is waiting on a confirmation.')}</div></div>`; }};

const tplOf=id=>{const d=TEMPLATES.find(t=>t.id===id);return {...d,...(S.data.templates[id]||{}),id};};
V.templates={title:'Templates',sub:'Starting points for your five formats. Written in English; write each language version yourself.',
 tools(){return '';},
 body(){return `<div class="grid c2">${TEMPLATES.map(d=>{const t=tplOf(d.id), custom=!!S.data.templates[d.id];return `<section class="panel"><h2>${esc(t.name)}${custom?'<small>edited by you</small>':''}</h2><p class="meta">${esc(t.blurb)}</p>
   <div><h3>Hook</h3><p>${esc(t.hook)}</p></div>
   <div><h3>Shotlist</h3><ol>${t.shotlist.map(s=>`<li>${esc(s)}</li>`).join('')}</ol></div>
   ${t.questions.length?`<div><h3>Questions</h3><ul>${t.questions.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></div>`:''}
   <div><h3>Title ideas</h3><ul>${t.titleIdeas.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></div>
   <div><h3>Canva thumbnail concept</h3><p>${esc(t.thumbnail)}</p></div>
   <div><h3>Caption</h3><p>${esc(t.caption)}</p></div><div><h3>Call to action</h3><p>${esc(t.cta)}</p></div>
   <div class="tools" style="margin-top:auto"><button class="btn pri" data-a="use-template" data-id="${d.id}">Create project</button><button class="btn" data-a="edit-template" data-id="${d.id}">Edit template</button>${custom?`<button class="btn danger" data-a="reset-template" data-id="${d.id}">Reset</button>`:''}</div></section>`;}).join('')}</div>`; }};

V.repurpose={title:'Shorts & Reels',sub:'Clips linked to the video they come from. “To look for” means a suggestion, not a moment confirmed in your footage.',
 tools(){const src=[...new Set(all('clips').map(c=>c.sourceKind+':'+c.sourceId))].map(k=>{const[kind,id]=k.split(':');return [k,sourceName({sourceKind:kind,sourceId:id})];});
  return `<select id="cf-src" data-cf aria-label="Original video">${opt(src,S.ui.cf,'All original videos')}</select><span class="sp"></span><button class="btn pri" data-a="new-clip">New clip</button>`;},
 body(){ const cs=all('clips').filter(c=>!S.ui.cf||c.sourceKind+':'+c.sourceId===S.ui.cf); if(!all('clips').length) return isEmpty()?starter():`<div class="empty">No clips yet. Create one and link it to its original video.<button class="btn pri" data-a="new-clip">New clip</button></div>`;
  const groups={}; cs.forEach(c=>{(groups[c.sourceKind+':'+c.sourceId]=groups[c.sourceKind+':'+c.sourceId]||[]).push(c);});
  return `<div class="grid">${Object.entries(groups).map(([k,list])=>{const[kind,id]=k.split(':');return `<section class="panel"><h2>${esc(sourceName(list[0]))}<small>${kind==='video'?'published video':'pipeline project'} · ${list.length} clip${list.length===1?'':'s'}</small></h2>
   <div class="grid c3">${list.map(c=>{const done=(c.subs||[]).filter(s=>s.done).length;return `<div class="act"><div class="tags"><span class="tag ${c.status==='suggested'?'verify':c.status==='published'?'ok':''}">${esc(label(CLIP_STATUS,c.status))}</span><span class="tag">9:16</span></div>
     <button class="linkish" data-a="edit-clip" data-id="${esc(c.id)}">${esc(c.title)}</button>
     <div class="meta num">Source timecode: ${c.tcIn||c.tcOut?esc(c.tcIn||'?')+' – '+esc(c.tcOut||'?'):'not set'}</div>
     <div class="meta">${esc(c.angle)}</div>${c.hook?`<div><b>Hook:</b> ${esc(c.hook)}</div>`:''}
     <div class="meta num">Subtitle checklist ${done}/${(c.subs||[]).length}</div></div>`;}).join('')}</div>
   <div><button class="btn sm" data-a="new-clip" data-kind="${kind}" data-id="${esc(id)}">Add clip from this video</button></div></section>`;}).join('')||`<div class="empty">No clip for this original.</div>`}</div>`; }};

V.backup={title:'Data & backup',sub:'Where your data lives, how to back it up, and what this app does not do.',
 tools(){return '';},
 body(){ const n=`${all('projects').length} projects, ${all('videos').length} archive records, ${all('clips').length} clips, ${all('templates').length} edited templates, ${all('channels').length} channel summaries`;
  return `<div class="grid c2">
   <section class="panel"><h2>Storage</h2>${S.mode==='sync'?`<p><span class="tag ok">Synchronized</span></p><p>Your data is saved in this page’s own database on Claude, tied to your account. Open this page on your desktop, iPad or phone while signed in and you see the same data; changes appear on other open devices within moments. It is not stored in your browser, so clearing browser data does not remove it. The page is private unless you share it; people you give contributor access could edit the same data.</p>`
    :S.mode==='local'?`<p><span class="tag verify">This browser only</span></p><p>The synchronized store is not available in this view, so data is saved in this browser’s local storage on this device. It does not appear on your other devices and is lost if you clear site data. Export a backup regularly.</p>`:`<p>Connecting…</p>`}
    <p class="meta">Currently stored: ${n}. Filters and the board/list choice are remembered per browser.</p></section>
   <section class="panel"><h2>What this app does not do</h2><ul><li>No live analytics. Channel numbers were read once from your public pages by Claude and are labelled with their capture date. They do not refresh by themselves: ask Claude to refresh them, or edit a record by hand.</li><li>No publishing or scheduling to any platform. Dates here are your plan.</li><li>No automatic translation. German, Luxembourgish, French and English are tags; you write each version.</li><li>No connection to CapCut or Canva. Shotlists, subtitle checklists and thumbnail concepts are notes for your own editing.</li></ul></section>
   <section class="panel"><h2>Password</h2><p>This page opens behind a password on each new visit. Use Lock in the sidebar to lock it again.</p><p class="meta">The password is a screen lock built into the page. What actually keeps your data private is that the page and its database belong to your Claude account: nobody can open the link unless you share it. Treat the password as a convenience, not as encryption.</p><div><button class="btn" data-a="lock">Lock now</button></div></section>
   <section class="panel"><h2>Export backup</h2><p class="meta">One JSON file with every project, archive record, clip and edited template.</p>
    <div class="tools">${S.dl?'<button class="btn pri" data-a="export-file">Save backup file</button>':''}<button class="btn${S.dl?'':' pri'}" data-a="export-copy">Copy backup JSON</button><button class="btn" data-a="export-show">Show JSON</button></div>
    <textarea class="code" id="export-box" readonly hidden aria-label="Backup JSON"></textarea></section>
   <section class="panel"><h2>Import backup</h2><p class="meta"><b>Merge</b> adds new records and updates existing ones, but never overwrites a field you edited yourself. <b>Replace</b> deletes everything first.</p>
    <label class="fld"><span>Choose a backup file</span><input type="file" id="import-file" accept=".json,application/json"></label>
    <label class="fld"><span>or paste backup JSON</span><textarea class="code" id="import-box" placeholder='{"app":"touchline-studio", …}'></textarea></label>
    <div class="tools"><button class="btn pri" data-a="import" data-mode="merge">Merge into my data</button><button class="btn danger" data-a="import" data-mode="replace">Replace everything</button>${isEmpty()?'<button class="btn" data-a="starter">Load starter plan</button>':''}</div></section>
  </div>`; }};

/* ---------- rendering ---------- */
function renderNav(){ const tb=$('#tabbar'); tb.hidden=false; tb.innerHTML=TABS.map(([r,l])=>`<a href="#${r}"${S.route===r?' aria-current="page"':''}><svg viewBox="0 0 24 24" aria-hidden="true">${ICON[r]}</svg>${l}</a>`).join('')+`<button data-a="more"${TABS.some(x=>x[0]===S.route)?'':' aria-current="page"'}><svg viewBox="0 0 24 24" aria-hidden="true">${ICON.more}</svg>More</button>`;
  $('#nav').innerHTML=NAV.map(([r,l,c])=>`<a href="#${r}"${S.route===r?' aria-current="page"':''}>${l}${c?`<span class="cnt">${c()}</span>`:''}</a>`).join('');
  const s=$('#sync'); s.className='sync '+(S.mode==='sync'?'ok':S.mode==='local'?'local':''); s.lastElementChild.textContent=S.mode==='sync'?'Synced to your Claude account':S.mode==='local'?(NATIVE?'Stored on this device only':'Stored in this browser only'):'Connecting…';
  $('#clock').textContent=fmt(todayLux(),{weekday:'short',day:'numeric',month:'short',year:'numeric'})+' · Luxembourg'; }
function renderBody(){ const v=V[S.route]; $('#v-body').innerHTML=!S.ready?loading():v.body(); }
function renderData(){ if(!S.unlocked) return; renderNav(); renderBody(); if(S.route==='repurpose') $('#v-tools').innerHTML=V.repurpose.tools(); }
function renderRoute(){ const h=location.hash.slice(1); S.route=V[h]?h:'home'; const v=V[S.route]; $('#view-head').hidden=!v.title;
  $('#view-title').textContent=v.title; $('#view-sub').textContent=v.sub; const t=v.tools(); $('#v-tools').innerHTML=t; $('#v-tools').hidden=!t; if(!S.unlocked) return; renderNav(); renderBody();
  ['#view-head','#v-tools','#v-body'].forEach((q,i)=>{const e=$(q);e.classList.remove('enter');void e.offsetWidth;e.style.animationDelay=(i*60)+'ms';e.classList.add('enter');}); window.scrollTo(0,0); }

/* ---------- modal + forms ---------- */
const fld=(l,inner,cls='')=>`<label class="fld ${cls}"><span>${l}</span>${inner}</label>`;
const inp=(id,v,type='text',ph='')=>`<input id="${id}" type="${type}" value="${esc(v)}" placeholder="${esc(ph)}">`;
const sel=(id,v,opts,any)=>`<select id="${id}">${any!=null?`<option value="">${any}</option>`:''}${opts.map(o=>{const[val,lab]=Array.isArray(o)?o:[o,o];return `<option value="${esc(val)}"${val===v?' selected':''}>${esc(lab)}</option>`;}).join('')}</select>`;
const ta=(id,v,rows=3,ph='')=>`<textarea id="${id}" rows="${rows}" placeholder="${esc(ph)}">${esc(v)}</textarea>`;
const chks=(name,vals,opts)=>`<div class="chks">${opts.map(o=>`<label class="chk"><input type="checkbox" name="${name}" value="${o}"${(vals||[]).includes(o)?' checked':''}>${o}</label>`).join('')}</div>`;
const rowHtml=(s,withCheck)=>`<div class="row">${withCheck?`<input type="checkbox"${s.done?' checked':''} aria-label="Done">`:''}<input type="text" value="${esc(s.t)}" aria-label="Item"><button type="button" class="x" data-a="row-del" aria-label="Remove">×</button></div>`;
const rowsEd=(id,items,withCheck,add)=>`<div class="rows" id="${id}" data-check="${withCheck?1:''}">${items.map(s=>rowHtml(s,withCheck)).join('')}</div><div><button type="button" class="btn sm" data-a="row-add" data-t="${id}">${add}</button></div>`;
const taskRow=k=>`<div class="row task"><input type="checkbox"${k.done?' checked':''} aria-label="Done"><input type="date" value="${esc(k.date||'')}" aria-label="Date"><input type="text" value="${esc(k.t)}" aria-label="Step"><button type="button" class="x" data-a="row-del" aria-label="Remove">×</button></div>`;
const readTasks=()=>$$('#p-tasks .row').map(r=>({t:$('input[type=text]',r).value.trim(),date:$('input[type=date]',r).value,done:$('input[type=checkbox]',r).checked})).filter(k=>k.t);
const readRows=id=>$$('#'+id+' .row').map(r=>({t:$('input[type=text]',r).value.trim(),done:!!($('input[type=checkbox]',r)||{}).checked})).filter(s=>s.t);
const val=id=>$('#'+id).value.trim(); const picked=name=>$$(`input[name=${name}]:checked`).map(i=>i.value);
let modalCtx=null;
function openModal(title,body,foot,ctx){ modalCtx=ctx||null; $('#modal-root').innerHTML=`<div class="overlay" data-a="overlay"><form class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}" novalidate><div class="modal-h"><h2>${esc(title)}</h2><button type="button" class="x" data-a="close" aria-label="Close">×</button></div><div class="modal-b">${body}</div><div class="modal-f">${foot}</div></form></div>`;
  const f=$('#modal-root input[type=text]'); if(f&&!ctx?.noFocus) f.focus(); }
function closeModal(){ $('#modal-root').innerHTML=''; modalCtx=null; }
const P_FIELDS=['title','origin','verify','verifyNote','status','type','topic','people','location','filmDate','publishDate','priority','languages','platforms','aspect','collab','material','hook','shotlist','questions','titleIdeas','thumbnail','caption','cta','notes','style','styleSteps','tasks'];
function trackEdits(prev,next,fields){ if(!prev) {next.userCreated=true;return;} if(prev.userCreated){next.userCreated=true;return;}
  const e=new Set(prev.edited||[]); fields.forEach(k=>{if(JSON.stringify(prev[k]??null)!==JSON.stringify(next[k]??null)) e.add(k);}); next.edited=[...e]; }

function projectModal(p,isNew){
  const body=`${p.verify?`<div class="note warn"><b>Status to verify.</b> ${esc(p.verifyNote)}</div>`:''}
  <fieldset><legend>Basics</legend>${fld('Title',inp('p-title',p.title),'wide')}
   ${fld('Status',sel('p-status',p.status,STATUSES))}${fld('Priority',sel('p-priority',p.priority,PRIOS))}

async function checkPw(raw){ const t=raw.trim().toLowerCase().replace(/\s+/g,' '), bytes=new TextEncoder().encode(t);
  try{ if(crypto&&crypto.subtle){const d=await crypto.subtle.digest('SHA-256',bytes);return [...new Uint8Array(d)].map(b=>b.toString(16).padStart(2,'0')).join('')===PW_SHA;} }catch(e){}
  let h=0x811c9dc5; for(const b of bytes){h^=b;h=Math.imul(h,0x01000193)>>>0;} return h===PW_FNV; }

function lock(){ S.unlocked=false; $('#tabbar').hidden=true; try{sessionStorage.removeItem(LSLOCK);}catch(e){} closeModal(); $('#app').hidden=true; $('#v-body').innerHTML=''; const l=$('#lock'); l.hidden=false; l.classList.remove('leaving'); $('#lock-pw').value=''; $('#lock-err').textContent=''; $('#lock-pw').focus(); }
A.lock=lock;
A.more=()=>openModal('More',`<div class="more-list">${NAV.filter(n=>!TABS.some(x=>x[0]===n[0])).map(([r,l,c])=>`<a href="#${r}" data-a="close">${l}<span class="meta num">${c?c():''}</span></a>`).join('')}</div>`,'<span class="sp"></span><button type="button" class="btn" data-a="lock">Lock</button>',{kind:'more',noFocus:true});
A.seg=el=>{S.ui.seg=el.dataset.v;S.ui.rankAll=false;saveUI();$('#v-tools').innerHTML=V.analysis.tools();renderBody();};
A['rank-all']=()=>{S.ui.rankAll=!S.ui.rankAll;renderBody();};
$('#lock-form').addEventListener('submit',async ev=>{ ev.preventDefault(); ev.stopPropagation(); const i=$('#lock-pw');
  if(await checkPw(i.value)) unlock(true); else { $('#lock-err').textContent=i.value?'That password is not right. Try again.':'Type your password.'; const c=$('.lock-card'); c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake'); i.select(); } });
let was=false; try{was=sessionStorage.getItem(LSLOCK)==='1';}catch(e){}
if(was) unlock(false); else $('#lock-pw').focus();
</script>
